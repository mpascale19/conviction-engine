    'twelve more arrive each day. Until all are in, the surprise rows change from one run to the next.') + '</p>';
}

/* Mese e anno di una data ISO, nella lingua scelta. */
function monthYear(s){
  try { return new Date(s + 'T12:00:00Z').toLocaleDateString(T('it-IT', 'en-GB'),
          { month: 'long', year: 'numeric' }); } catch (e) { return s; }
}

/* Mentre lo storico dei Form 4 si allunga (a cinque anni, poi dal 23/11/2026 a dieci), a rate, la pagina lo
   dice: i numeri qui sotto crescono da un giro all'altro, e non è un errore. */
function historyNote(){
  var hs = IDX.history;
  if (!hs || !hs.total || hs.complete >= hs.total) return '';
  var miss = (hs.missing || 0).toLocaleString(T('it-IT', 'en-GB'));
  return '<p class="sub" style="margin-top:-4px">' + T(
    'Lo storico dei Form 4 si sta allungando a dieci anni, un aggiornamento dopo l\u2019altro: è completo ' +
    'per ' + hs.complete + ' aziende su ' + hs.total + ' (mancano ancora ' + miss + ' documenti). ' +
    'Finché non ha finito, i numeri di questa pagina cambiano da un giro all\u2019altro. ' +
    'Il punteggio di oggi invece è già completo per tutte: i documenti degli ultimi quattro mesi ' +
    'si scaricano sempre per primi.',
    'The Form 4 history is being extended to ten years, one update after another: it is complete for ' +
    hs.complete + ' companies out of ' + hs.total + ' (' + miss + ' documents still to go). Until it ' +
    'finishes, the numbers on this page change from one run to the next. Today\u2019s score, though, is ' +
    'already complete for all of them: the documents of the last four months are always downloaded first.') + '</p>';
}

/* Le voci che si possono ricostruire nel passato, messe alla prova. La
   lettura nasce dal rapporto fra il numero e la sua incertezza: sotto due volte
   l'incertezza, il sito non dice "segnale" ma "indistinguibile dal caso". */
function icCard(){
  var ic = IDX.ic;
  if (!ic || !ic.rows) return '';
  var names = { price: T('Contesto di prezzo', 'Price context'), sector: T('Settore', 'Sector'),
                market: T('Mercato', 'Market'), events: T('Fatti rilevanti (8-K)', 'Material events (8-K)'),
                surprise: T('Sorpresa sugli utili', 'Earnings surprise'),
                breadth: T('Ampiezza dei grandi fondi (13F)', 'Breadth of fund ownership (13F)') };
  var notes = { price: T('dalle chiusure', 'from closing prices'),
                sector: T('dai Form 4 di tutto l’universo', 'from the Form 4s of the whole universe'),
                market: T('solo la storia dello short interest del titolo', 'only the stock’s own short-interest history'),
                events: T('solo le date coperte dal file della SEC', 'only the dates covered by the SEC file'),
                surprise: T('non è nel punteggio: l’ultima trimestrale contro le attese',
                            'not in the score: the latest results against estimates'),
                breadth: T('non è nel punteggio: quanti più gestori lo possiedono rispetto al trimestre prima',
                           'not in the score: how many more managers own it than the quarter before') };
  var rows = ic.rows.map(function(r){
    var read, col = 'var(--ink3)';
    if (r.ic == null) read = T('non ancora calcolabile', 'not computable yet');
    else if (r.t == null || Math.abs(r.t) < 2) read = T('indistinguibile dal caso', 'indistinguishable from chance');
    else if (r.t >= 2) { read = T('segnale nella direzione attesa', 'signal in the expected direction'); col = 'var(--bull2)'; }
    else { read = T('segnale al contrario', 'signal in the opposite direction'); col = 'var(--bear2)'; }
    return '<tr style="cursor:default"><td><b>' + esc(names[r.id] || r.id) + '</b><div class="nm">' +
      esc(notes[r.id] || '') + '</div></td>' +
      '<td class="num">' + (r.ic == null ? '—' : sg(r.ic, 2)) + '</td>' +
      '<td class="num" style="color:var(--ink3)">' + (r.se == null ? '—' : '± ' + r.se.toFixed(2)) + '</td>' +
      '<td style="color:' + col + '">' + esc(read) + '</td></tr>';
  }).join('');
  // la soglia sotto cui un segnale non si distingue dal caso: due volte
  // l'incertezza tipica. Si abbassa da sola man mano che la storia si allunga.
  var ses = ic.rows.filter(function(r){ return r.se != null; }).map(function(r){ return r.se; })
                   .sort(function(a, b){ return a - b; });
  var thr = ses.length ? 2 * ses[Math.floor(ses.length / 2)] : null;
  var thrEn = thr == null ? '—' : thr.toFixed(2), thrIt = thrEn.replace('.', ',');
  var fmtD = function(s){ try { return new Date(s).toLocaleDateString(T('it-IT', 'en-GB'),
    { month: 'short', year: 'numeric' }); } catch (e) { return s; } };
  return '<div class="card"><h2>' + T('Le altre voci, alla prova', 'The other inputs, put to the test') +
    '</h2><p class="sub">' + T(
      'Quattro voci del punteggio si possono ricostruire giorno per giorno nel passato senza inventare ' +
      'niente, e con loro due che nel punteggio non ci sono, la sorpresa sugli utili e l’ampiezza dei grandi ' +
      'fondi: se qui una delle due mostrasse un segnale, sarebbe la ragione per farla entrare. Per ogni data, dentro ogni universo, si guarda se le aziende con il valore più alto hanno ' +
      'poi reso di più delle altre nei ' + ic.horizon + ' giorni successivi: 1 vorrebbe dire sempre, 0 per ' +
      'niente, −1 sempre al contrario. Il confronto è fra aziende nella stessa data, quindi ' +
      'l’andamento del mercato si annulla. Date fra ' + fmtD(ic.from) + ' e ' + fmtD(ic.to) + '.',
      'Four inputs of the score can be rebuilt day by day in the past without inventing anything, and so ' +
      'can two that are not in the score, the earnings surprise and the breadth of fund ownership: if either ' +
      'showed a signal here, that would be the reason to bring it in. For each date, within each universe, we check whether the companies with the highest value went on to ' +
      'beat the others over the next ' + ic.horizon + ' days: 1 would mean always, 0 not at all, −1 ' +
      'always the opposite. The comparison is between companies on the same date, so the market’s ' +
      'direction cancels out. Dates between ' + fmtD(ic.from) + ' and ' + fmtD(ic.to) + '.') + '</p>' +
    '<div class="scroll"><table><thead><tr><th>' + T('Voce', 'Input') + '</th>' +
    '<th class="num">' + T('Correlazione', 'Correlation') + '</th>' +
    '<th class="num">' + T('Incertezza', 'Uncertainty') + '</th>' +
    '<th>' + T('Lettura', 'Reading') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="sub" style="margin-top:12px"><b>' + T('Come leggerlo.', 'How to read it.') + '</b> ' + T(
      'Il metodo è stato controllato in due modi: un segnale che conosce il futuro dà 1, un segnale tirato ' +
      'a caso dà 0. Con i dati di questa prova, però, si vedrebbe solo una correlazione sopra circa ' +
      thrIt + ', mentre i segnali che funzionano sui mercati valgono di solito pochi centesimi. Quindi ' +
      '«indistinguibile dal caso» non vuol dire che la voce è inutile: vuol dire che non c’è nessuna ' +
      'prova per darle più peso. Per questo i pesi restano dove sono, invece di essere alzati senza motivo. ' +
      'La prova si rifà a ogni aggiornamento.',
      'The method was checked two ways: a signal that knows the future scores 1, a random signal scores 0. ' +
      'With the data in this test, though, only a correlation above about ' + thrEn + ' would show, ' +
      'while signals that work in markets are usually worth a few hundredths. So «indistinguishable from ' +
      'chance» does not mean the input is useless: it means there is no evidence for giving it more weight. ' +
      'That is why the weights stay where they are, instead of being raised for no reason. The test is ' +
      'redone at every update.') + '</p></div>';
}

/* ------------------------------------------------------------------ dopo un acquisto
   Lo studio di evento: tutte le campagne di acquisto allineate sul loro primo
   giorno, e la media del rendimento oltre il settore dai 20 giorni di borsa
   prima ai 120 dopo. I numeri li calcola pipeline/eventstudy.py; qui si
   disegnano. Il grafico si costruisce dopo che la pagina è nel documento,
   perché la sua larghezza è quella vera del riquadro: su un telefono le
   scritte restano leggibili invece di rimpicciolirsi con tutto il disegno. */
var EVG = 'all';                 // il confronto scelto
var EVK = null;                  // la seduta sotto il puntatore (o la tastiera)

function evSets(ev){
  var g = ev.groups, ok = function(id){ return g[id] && g[id].camp >= ev.min; };
  var s = [{ id: 'all', label: T('Tutte le campagne', 'All campaigns'), series: ['all'] }];
  if (ok('cluster') && ok('solo')) s.push({ id: 'cluster', label: T('Cluster o no', 'Cluster or not'), series: ['cluster', 'solo'] });
  if (ok('senior') && ok('other')) s.push({ id: 'senior', label: T('Dirigenti o altri', 'Executives or others'), series: ['senior', 'other'] });
  if (ok('beat') && ok('nobeat')) s.push({ id: 'beat', label: T('Dopo la trimestrale', 'After results'), series: ['beat', 'nobeat'] });
  var sz = ['large', 'mid', 'small'].filter(ok);
  if (sz.length > 1) s.push({ id: 'size', label: T('Per dimensione', 'By size'), series: sz });
  return s;
}

function evName(id){
  return ({ all: T('Tutte le campagne', 'All campaigns'),
            cluster: T('Cluster (3 o più persone)', 'Cluster (3 or more people)'),
            solo: T('Senza cluster', 'No cluster'),
            senior: T('Con un dirigente apicale', 'With a top executive'),
            other: T('Senza dirigenti apicali', 'Without top executives'),
            beat: T('Dopo una trimestrale sopra le attese', 'After results above expectations'),
            nobeat: T('Dopo una in linea o sotto', 'After results in line or below'),
            large: T('Grandi capitalizzazioni', 'Large caps'),
            mid: T('Medie (S&P 400)', 'Mid caps (S&P 400)'),
            small: T('Piccole (S&P 600)', 'Small caps (S&P 600)') })[id] || id;
}

function evCur(ev){
  var sets = evSets(ev);
  return sets.filter(function(s){ return s.id === EVG; })[0] || sets[0];
}

/* Una frase che nasce dai numeri: quanto prima, quanto dopo, e se il caso lo spiega. */
function evReading(ev){
  var s = ev.groups.all.seg, b = s.before, a = s.to60;
  if (!b || b.mean == null || !a || a.mean == null) return '';
  var strong = function(x){ return x.t != null && Math.abs(x.t) >= 2; };
  var it = 'Nei 20 giorni di borsa prima del primo acquisto il titolo ha fatto in media ' + sg(b.mean, 1) +
    '% rispetto al suo settore' + (b.mean < 0 ? ': gli insider comprano dopo un calo' : '') + '. ' +
    'Da quando il Form 4 è pubblico (seduta +' + ev.public_day + ') a +60: ' + sg(a.mean, 1) + '%, ' +
    (strong(a) ? 'più di quanto il caso spieghi di solito (t = ' + nu(a.t.toFixed(1)) + ').'
               : 'ancora dentro quello che il caso può spiegare (t = ' + nu(a.t.toFixed(1)) + ').');
  var en = 'In the 20 trading days before the first purchase the stock returned on average ' + sg(b.mean, 1) +
    '% against its sector' + (b.mean < 0 ? ': insiders buy after a fall' : '') + '. ' +
    'From when the Form 4 is public (day +' + ev.public_day + ') to +60: ' + sg(a.mean, 1) + '%, ' +
    (strong(a) ? 'more than chance usually explains (t = ' + a.t.toFixed(1) + ').'
               : 'still within what chance can explain (t = ' + a.t.toFixed(1) + ').');
  return T(it, en);
}

function evCard(){
  var ev = IDX.event;
  if (!ev || !ev.groups || !ev.groups.all) return '';
  var cur = evCur(ev), sets = evSets(ev);
  var pills = sets.length > 1 ? '<div class="evp" role="group" aria-label="' +
    esc(T('Che cosa confrontare', 'What to compare')) + '">' + sets.map(function(s){
      return '<button type="button" class="gf" data-evg="' + s.id + '" aria-pressed="' +
        (s.id === cur.id) + '">' + esc(s.label) + '</button>';
    }).join('') + '</div>' : '';
  var legend = '<div class="evl">' + cur.series.map(function(id, i){
    return '<span><i style="background:var(--c' + (i + 1) + ')"></i>' + esc(evName(id)) +
      ' <span class="nm">· ' + ev.groups[id].camp + ' ' + T('campagne', 'campaigns') + '</span></span>';
  }).join('') + '</div>';
  return '<div class="card"><h2>' + T('Dopo un acquisto, seduta per seduta', 'After a purchase, day by day') +
    '</h2><p class="sub">' + T(
      'Tutte le campagne di acquisto allineate sul loro primo giorno (la linea verticale), e la media ' +
      'di quanto il titolo ha fatto meglio o peggio del suo settore, sommando seduta dopo seduta da 20 ' +
      'giorni di borsa prima a 120 dopo. La fascia chiara è l’incertezza: dove contiene lo zero, il caso ' +
      'basta a spiegare la curva.',
      'Every buying campaign lined up on its first day (the vertical line), and the average of how much ' +
      'the stock did better or worse than its sector, adding up day after day from 20 trading days before ' +
      'to 120 after. The light band is the uncertainty: where it contains zero, chance is enough to ' +
      'explain the curve.') + '</p>' +
    '<p class="evr">' + esc(evReading(ev)) + '</p>' + pills + legend +
    '<div class="evw" id="evw"><div class="evtip" id="evtip" hidden></div></div>' +
    evSegTable(ev, cur) +
    '<details class="evd"><summary>' + T('I numeri della curva', 'The numbers behind the curve') +
    '</summary>' + evTable(ev, cur) + '</details>' +
    '<p class="sub" style="margin-top:12px">' + T(
      'Il giorno zero è quello dell’operazione: il Form 4 che la rende pubblica arriva entro due giorni ' +
      'lavorativi, quindi chi legge i depositi può comprare al più presto dalla seduta +' + ev.public_day +
      '. Ogni campagna entra nella media finché ha prezzi: quelle recenti escono prima, e il numero di ' +
      'campagne di ogni seduta è nei numeri qui sopra. L’incertezza tiene conto che campagne degli stessi ' +
      'mesi vivono la stessa borsa (errori a grappoli, blocchi di ' + ev.block_days + ' giorni). ' +
      ev.camp + ' campagne dal ' + day(ev.from) + ' al ' + day(ev.to) + '.',
      'Day zero is the trade date: the Form 4 that makes it public arrives within two business days, so ' +
      'someone reading the filings can buy at the earliest from day +' + ev.public_day + '. Each campaign ' +
      'counts in the average while it has prices: recent ones drop out sooner, and the number of ' +
      'campaigns behind each day is in the numbers above. The uncertainty allows for campaigns in the same ' +
      'months living through the same market (clustered errors, ' + ev.block_days + '-day blocks). ' +
      ev.camp + ' campaigns from ' + day(ev.from) + ' to ' + day(ev.to) + '.') + '</p></div>';
}

/* I quattro tratti che contano, con la loro incertezza. */
function evSegTable(ev, cur){
  var rows = [['before', T('Nei 20 giorni prima', 'In the 20 days before'), T('da −20 a −1', 'from −20 to −1')],
              ['first', T('Giorno zero e +1', 'Day zero and +1'), T('il Form 4 non è ancora pubblico', 'the Form 4 is not public yet')],
              ['to60', T('Da +' + ev.public_day + ' a +60', 'From +' + ev.public_day + ' to +60'), T('quello che si poteva prendere', 'what could be captured')],
              ['to120', T('Da +' + ev.public_day + ' a +120', 'From +' + ev.public_day + ' to +120'), '']];
  var cell = function(x){
    if (!x || x.mean == null) return '<td class="num">—</td>';
    var col = Math.abs(x.t || 0) < 2 ? 'inherit' : x.mean > 0 ? 'var(--bull)' : 'var(--bear)';
    return '<td class="num"><b style="color:' + col + '">' + sg(x.mean, 1) + '%</b>' +
      '<div class="nm">t ' + (x.t == null ? '—' : sg(x.t, 1)) + ' · ' + x.n + '</div></td>';
  };
  return '<div class="scroll" style="margin-top:14px"><table class="t-narrow"><thead><tr><th>' +
    T('Tratto', 'Stretch') + '</th>' + cur.series.map(function(id, i){
      return '<th class="num"><i class="evsw" style="background:var(--c' + (i + 1) + ')"></i>' +
        esc(cur.series.length > 1 ? evName(id) : T('Media', 'Average')) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows.map(function(r){
      return '<tr style="cursor:default"><td><b>' + esc(r[1]) + '</b>' + (r[2] ? '<div class="nm">' + esc(r[2]) + '</div>' : '') +
        '</td>' + cur.series.map(function(id){ return cell(ev.groups[id].seg[r[0]]); }).join('') + '</tr>';
    }).join('') + '</tbody></table></div><p class="sub" style="margin-top:6px">' + T(
      'Sotto ogni valore: t (quante volte il valore è più grande del suo errore standard) e quante ' +
      'campagne. Il colore compare solo se t supera 2 in valore assoluto.',
      'Under each value: t (how many times the value exceeds its standard error) and how many campaigns. ' +
      'Colour appears only when t exceeds 2 in absolute value.') + '</p>';
}

/* La tabella della curva, una riga ogni dieci sedute: la versione da leggere senza il disegno. */
function evTable(ev, cur){
  var ks = [-20, -10, -1, 0, 1, 2, 5, 10, 20, 30, 40, 50, 60, 80, 100, 120];
  return '<div class="scroll"><table class="t-narrow"><thead><tr><th>' + T('Seduta', 'Day') + '</th>' +
    cur.series.map(function(id){ return '<th class="num">' + esc(evName(id)) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + ks.map(function(k){
      var i = k + ev.pre;
      return '<tr style="cursor:default"><td>' + (k > 0 ? '+' + k : k < 0 ? '−' + (-k) : '0') + '</td>' +
        cur.series.map(function(id){
          var c = ev.groups[id].curve, m = c.mean[i];
          return '<td class="num">' + (m == null ? '—' : sg(m, 1) + '%<div class="nm">' +
            sg(c.lo[i], 1) + ' … ' + sg(c.hi[i], 1) + ' · ' + c.n[i] + '</div>') + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

/* Il disegno. Linee di 2px, fascia dell'incertezza al 12%, griglia sottile;
   il colore sta solo sui segni, le scritte restano nei colori del testo. */
function evDraw(){
  var ev = IDX && IDX.event, box = document.getElementById('evw');
  if (!ev || !box) return;
  var cur = evCur(ev), pre = ev.pre, post = ev.post;
  var W = Math.max(280, box.clientWidth), narrow = W < 480;
  var H = narrow ? 230 : 280, m = { l: narrow ? 40 : 46, r: narrow ? 14 : 64, t: 22, b: 34 };
  var ser = cur.series.map(function(id, i){ return { id: id, c: 'var(--c' + (i + 1) + ')', d: ev.groups[id].curve }; });
  var lo = 0, hi = 0;
  ser.forEach(function(s){ s.d.mean.forEach(function(v, i){
    if (v == null) return; lo = Math.min(lo, s.d.lo[i]); hi = Math.max(hi, s.d.hi[i]); }); });
  var span = Math.max(hi - lo, 1), step = [0.5, 1, 2, 2.5, 5, 10, 20].filter(function(x){ return span / x <= 6; })[0] || 25;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  var X = function(k){ return m.l + (k + pre) / (pre + post) * (W - m.l - m.r); };
  var Y = function(v){ return m.t + (hi - v) / (hi - lo) * (H - m.t - m.b); };
  var g = '';
  for (var v = lo; v <= hi + 1e-9; v += step) {
    g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' +
      (Math.abs(v) < 1e-9 ? 'var(--axis)' : 'var(--line)') + '" stroke-width="1"/>' +
      '<text x="' + (m.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" class="evax">' +
      (Math.abs(v) < 1e-9 ? '0' : sg(v, step < 1 ? 1 : 0)) + '%</text>';
  }
  var xt = narrow ? [-20, 0, 40, 80, 120] : [-20, 0, 20, 40, 60, 80, 100, 120];
  xt.forEach(function(k){
    g += '<text x="' + X(k) + '" y="' + (H - m.b + 16) + '" text-anchor="middle" class="evax">' +
      (k > 0 ? '+' + k : k < 0 ? '−' + (-k) : '0') + '</text>';
  });
  g += '<text x="' + (W - m.r) + '" y="' + (H - 4) + '" text-anchor="end" class="evax">' +
    esc(T('sedute dal primo acquisto', 'trading days from the first purchase')) + '</text>';
  g += '<line x1="' + X(0) + '" x2="' + X(0) + '" y1="' + (m.t - 8) + '" y2="' + (H - m.b) + '" stroke="var(--ink3)" stroke-width="1"/>' +
    '<text x="' + (X(0) + 5) + '" y="' + (m.t - 10 + 9) + '" class="evax">' + esc(T('primo acquisto', 'first purchase')) + '</text>';
  // fasce e linee, interrotte dove la media manca
  var runs = function(d){
    var out = [], r = [];
    d.mean.forEach(function(v, i){ if (v == null) { if (r.length) out.push(r); r = []; } else r.push(i); });
    if (r.length) out.push(r);
    return out;
  };
  ser.forEach(function(s){
    runs(s.d).forEach(function(r){
      var top = r.map(function(i){ return X(i - pre).toFixed(1) + ',' + Y(s.d.hi[i]).toFixed(1); });
      var bot = r.slice().reverse().map(function(i){ return X(i - pre).toFixed(1) + ',' + Y(s.d.lo[i]).toFixed(1); });
      g += '<polygon points="' + top.concat(bot).join(' ') + '" fill="' + s.c + '" fill-opacity=".12"/>';
    });
  });
  var ends = [];
  ser.forEach(function(s){
    runs(s.d).forEach(function(r){
      g += '<polyline points="' + r.map(function(i){ return X(i - pre).toFixed(1) + ',' + Y(s.d.mean[i]).toFixed(1); }).join(' ') +
        '" fill="none" stroke="' + s.c + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    var last = -1;
    s.d.mean.forEach(function(v, i){ if (v != null) last = i; });
    if (last >= 0) {
      g += '<circle cx="' + X(last - pre) + '" cy="' + Y(s.d.mean[last]) + '" r="4" fill="' + s.c + '" stroke="var(--card)" stroke-width="2"/>';
      ends.push({ x: X(last - pre), y: Y(s.d.mean[last]), v: s.d.mean[last] });
    }
  });
  // il valore alla fine della linea, solo se c'è posto e le etichette non si toccano
  if (!narrow && (ends.length < 2 || Math.abs(ends[0].y - ends[1].y) >= 16)) {
    ends.forEach(function(e){
      g += '<text x="' + (e.x + 8) + '" y="' + (e.y + 4) + '" class="evend">' + sg(e.v, 1) + '%</text>';
    });
  }
  g += '<g id="evhair" style="display:none"><line id="evhl" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="var(--ink2)" stroke-width="1"/>' +
    ser.map(function(s, i){ return '<circle id="evhd' + i + '" r="4" fill="' + s.c + '" stroke="var(--card)" stroke-width="2"/>'; }).join('') + '</g>';
  var label = T('Rendimento cumulato oltre il settore, da 20 sedute prima a 120 dopo il primo acquisto',
                'Cumulative return over the sector, from 20 trading days before to 120 after the first purchase');
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" tabindex="0" aria-label="' +
    esc(label + '. ' + evReading(ev)) + '">' + g + '<rect id="evhit" x="' + m.l + '" y="0" width="' + (W - m.l - m.r) +
    '" height="' + H + '" fill="transparent"/></svg>';
  var tip = document.getElementById('evtip');
  [].forEach.call(box.querySelectorAll('svg'), function(n){ n.remove(); });
  box.insertAdjacentHTML('afterbegin', svg);
  var el = box.querySelector('svg');
  var showK = function(k){
    if (k == null) { document.getElementById('evhair').style.display = 'none'; tip.hidden = true; return; }
    k = Math.max(-pre, Math.min(post, k)); EVK = k;
    var i = k + pre, x = X(k), any = false;
    document.getElementById('evhair').style.display = '';
    var hl = document.getElementById('evhl'); hl.setAttribute('x1', x); hl.setAttribute('x2', x);
    var lines = ser.map(function(s, j){
      var v = s.d.mean[i], dot = document.getElementById('evhd' + j);
      if (v == null) { dot.style.display = 'none'; return '<div><i style="background:' + s.c + '"></i>' + esc(evName(s.id)) + ': —</div>'; }
      any = true; dot.style.display = ''; dot.setAttribute('cx', x); dot.setAttribute('cy', Y(v));
      var since = (k >= 0 && s.d.mean[pre - 1] != null) ? ' · ' + T('dal giorno prima: ', 'from the day before: ') + sg(v - s.d.mean[pre - 1], 1) + '%' : '';
      return '<div><i style="background:' + s.c + '"></i>' + esc(evName(s.id)) + ': <b>' + sg(v, 1) + '%</b>' +
        '<span class="nm"> (' + sg(s.d.lo[i], 1) + ' … ' + sg(s.d.hi[i], 1) + ')' + since + ' · ' + s.d.n[i] + ' ' +
        T('campagne', 'campaigns') + '</span></div>';
    });
    tip.innerHTML = '<div class="evth">' + esc(T('Seduta ', 'Day ')) + (k > 0 ? '+' + k : k < 0 ? '−' + (-k) : '0') +
      (k === 0 ? ' · ' + esc(T('primo acquisto', 'first purchase')) : '') + '</div>' + lines.join('');
    tip.hidden = false;
    var tw = tip.offsetWidth, left = x + 14;
    if (left + tw > W - 4) left = Math.max(4, x - 14 - tw);
    tip.style.left = left + 'px';
    tip.style.top = (m.t) + 'px';
    if (!any) tip.hidden = true;
  };
  var fromEvent = function(e){
    var r = el.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    return Math.round((px - m.l) / (W - m.l - m.r) * (pre + post) - pre);
  };
  el.addEventListener('pointermove', function(e){ showK(fromEvent(e)); });
  el.addEventListener('pointerdown', function(e){ showK(fromEvent(e)); });
  el.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') showK(null); });
  el.addEventListener('blur', function(){ showK(null); });
  el.addEventListener('keydown', function(e){
    var k = EVK == null ? 0 : EVK;
    if (e.key === 'ArrowRight') { showK(k + (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { showK(k - (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === 'Escape') { showK(null); }
  });
}

function evMount(){
  if (!document.getElementById('evw')) return;
  EVK = null;
  evDraw();
  [].forEach.call(app.querySelectorAll('[data-evg]'), function(b){
    b.addEventListener('click', function(){ EVG = b.dataset.evg; renderBacktest(); });
  });
}

var evResize = null;
window.addEventListener('resize', function(){
  clearTimeout(evResize);
  evResize = setTimeout(function(){ if (document.getElementById('evw')) evDraw(); }, 120);
});

/* ------------------------------------------------------------------ abituali o opportunisti
   Cohen, Malloy e Pomorski (2012): chi compra o vende ogni anno nello stesso
   mese segue il calendario, non quello che sa. I numeri li calcola
   pipeline/habits.py; qui si mostrano, e la lettura nasce dai numeri. */
function habitsCard(){
  var hb = IDX.habits;
  if (!hb || !hb.buy) return '';
  var y0 = +String(hb.from).slice(0, 4);
  var row = function(label, s, note){
    if (!s || s.mean == null) return '<tr style="cursor:default"><td><b>' + esc(label) + '</b>' +
      (note ? '<div class="nm">' + esc(note) + '</div>' : '') + '</td><td class="num">' + (s ? s.n : 0) +
      '</td><td class="num hide-s">' + (s ? s.people : 0) + '</td><td class="num hide-s">—</td><td class="num">—</td></tr>';
    var col = (s.t != null && Math.abs(s.t) >= 2) ? (s.mean > 0 ? 'var(--bull)' : 'var(--bear)') : 'inherit';
    return '<tr style="cursor:default"><td><b>' + esc(label) + '</b>' + (note ? '<div class="nm">' + esc(note) + '</div>' : '') +
      '</td><td class="num">' + s.n + '</td><td class="num hide-s">' + s.people + '</td><td class="num hide-s">' + s.pos + '%</td>' +
      '<td class="num"><b style="color:' + col + '">' + sg(s.mean, 1) + '%</b><div class="nm">t ' +
      (s.t == null ? '—' : sg(s.t, 1)) + '</div></td></tr>';
  };
  var head = '<tr><td colspan="5" class="nm" style="padding-top:14px"><b>';
  // le parole cambiano con il verso: gli acquisti (maschile), le vendite (femminile)
  var W = { buy: { it: ['Gli acquisti opportunistici', 'agli abituali', 'acquisti'], en: ['Opportunistic purchases', 'routine ones', 'purchases'] },
            sell: { it: ['Le vendite discrezionali opportunistiche', 'alle abituali', 'vendite discrezionali'], en: ['Opportunistic discretionary sales', 'routine ones', 'discretionary sales'] } };
  var read = function(side){
    var s = hb[side], r = s.routine, o = s.opp, d = s.diff;
    var w = W[side];
    if (!r || r.mean == null || !o || o.mean == null || !d) return T(
      'Per ' + (side === 'buy' ? 'gli ' : 'le ') + w.it[2] + ' i casi classificabili sono ancora troppo pochi per un ' +
      'confronto (servono almeno ' + hb.min + ' per gruppo).',
      'For ' + w.en[2] + ' the classifiable cases are still too few for a comparison (at least ' + hb.min +
      ' per group are needed).');
    var big = d.t != null && Math.abs(d.t) >= 2;
    return T(
      w.it[0] + ' hanno reso ' + sg(d.mean, 1) + ' punti rispetto ' + w.it[1] + ' (t = ' +
      nu(d.t.toFixed(1)) + '): ' + (big ? 'una differenza più grande di quanto il caso spieghi di solito.'
                                        : 'una differenza che il caso può ancora spiegare.'),
      w.en[0] + ' returned ' + sg(d.mean, 1) + ' points relative to ' + w.en[1] + ' (t = ' +
      d.t.toFixed(1) + '): ' + (big ? 'a gap larger than chance usually explains.'
                                   : 'a gap that chance can still explain.'));
  };
  return '<div class="card"><h2>' + T('Abituali o opportunisti', 'Routine or opportunistic') + '</h2><p class="sub">' + T(
      'Molti insider comprano o vendono sempre nello stesso periodo dell’anno: dopo il bonus, prima delle ' +
      'tasse, all’apertura di una certa finestra. Quelle operazioni seguono il calendario, non quello che ' +
      'l’insider sa. Cohen, Malloy e Pomorski (Journal of Finance, 2012) le hanno separate dalle altre: ' +
      'un’operazione è abituale se il suo autore ne ha fatta una dello stesso verso nello stesso mese in ' +
      'ciascuno dei tre anni precedenti, opportunistica se ha operato in tutti e tre gli anni ma non in ' +
      'quel mese. Nel loro studio solo le opportunistiche anticipano i rendimenti. Qui la stessa prova, ' +
      'sulle operazioni dal ' + y0 + ' in poi (prima mancano tre anni interi di storia), con il rendimento ' +
      'oltre il settore nelle ' + hb.horizon + ' sedute dopo. Ogni insider conta una volta per mese: un caso è una persona in un mese.',
      'Many insiders always buy or sell at the same time of year: after the bonus, before taxes, when a ' +
      'certain window opens. Those trades follow the calendar, not what the insider knows. Cohen, Malloy ' +
      'and Pomorski (Journal of Finance, 2012) separated them from the rest: a trade is routine if its ' +
      'author made one in the same direction in the same month in each of the three previous years, ' +
      'opportunistic if they traded in all three years but not in that month. In their study only the ' +
      'opportunistic ones predict returns. Here is the same test, on trades from ' + y0 + ' onwards ' +
      '(before that three full years of history are missing), with the return over the sector in the ' +
      hb.horizon + ' trading days after. Each insider counts once per month: a case is one person in one month.') + '</p>' +
    '<div class="scroll" style="margin-top:12px"><table class="t-narrow"><thead><tr><th>' + T('Operazioni', 'Trades') + '</th>' +
    '<th class="num">' + T('Casi', 'Cases') + '</th><th class="num hide-s">' + T('Insider', 'Insiders') +
    '</th><th class="num hide-s">' + T('In guadagno', 'In the money') + '</th><th class="num">' +
    T('Rendimento', 'Return') + '</th></tr></thead><tbody>' +
    head + esc(T('Acquisti', 'Purchases')) + '</b></td></tr>' +
    row(T('Abituali', 'Routine'), hb.buy.routine, T('stesso mese nei tre anni prima', 'same month in the three years before')) +
    row(T('Opportunistici', 'Opportunistic'), hb.buy.opp, T('ogni anno, ma non in questo mese', 'every year, but not in this month')) +
    row(T('Non classificabili', 'Not classifiable'), hb.buy.none, T('non hanno operato in tutti e tre gli anni', 'did not trade in all three years')) +
    head + esc(T('Vendite discrezionali', 'Discretionary sales')) + '</b></td></tr>' +
    row(T('Abituali', 'Routine'), hb.sell.routine) +
    row(T('Opportunistiche', 'Opportunistic'), hb.sell.opp) +
    row(T('Non classificabili', 'Not classifiable'), hb.sell.none) +
    '</tbody></table></div>' +
    '<p class="evr">' + esc(read('buy')) + ' ' + esc(read('sell')) + '</p>' +
    '<p class="sub" style="margin-top:10px">' + T(
      'Per una vendita ci si aspetta il contrario di un acquisto: se l’insider sa qualcosa, dopo il titolo ' +
      'scende. L’etichetta compare nelle operazioni di ogni scheda e fra le ragioni della voce insider, ma ' +
      'per ora non sposta punti: li sposterà se questa prova, con più anni, dirà che la differenza c’è. ' +
      'L’incertezza tiene conto che operazioni degli stessi mesi vivono la stessa borsa. Il colore compare ' +
      'solo se t supera 2 in valore assoluto.',
      'For a sale one expects the opposite of a purchase: if the insider knows something, the stock falls ' +
      'afterwards. The label shows up in each company’s transactions and among the reasons of the insider ' +
      'input, but for now it moves no points: it will if this test, with more years, says the gap is real. ' +
      'The uncertainty allows for trades in the same months living through the same market. Colour ' +
      'appears only when t exceeds 2 in absolute value.') + '</p></div>';
}

/* ------------------------------------------------------------------ il termometro degli insider
   Tutte le aziende insieme: su cento insider che hanno comprato o venduto
   negli ultimi tre mesi, quanti hanno comprato. I numeri li calcola
   pipeline/thermometer.py; qui si mostrano, e la lettura nasce dai numeri. */
var THK = null;                              // il mese sotto il cursore nel disegno

function pc1(v){ return v == null ? '—' : nu(v.toFixed(1)) + '%'; }
function nelPct(n){                          // «nel 96%», ma «nell'80%», «nell'8%», «nell'11%»
  return (n === 1 || n === 8 || n === 11 || (n >= 80 && n < 90)) ? 'nell’' + n + '%' : 'nel ' + n + '%';
}
function thMonth(m){ return monthYear(m + '-01'); }
function thDay(s){                           // «1 settembre 2026» dentro una frase
  try { return new Date(s + 'T12:00:00Z').toLocaleDateString(LOC, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
  catch (e) { return s; }
}
function thN(n){ return Number(n).toLocaleString(LOC); }

/* Due termometri: tutto il mercato (dai data set della SEC, dal 2006) e le
   duecento aziende. thSel() dà quello scelto con i pulsanti, nella stessa forma. */
var THS = 'all';
function NCO(){ return (IDX && IDX.companies || []).length; }   // quante aziende segue il sito
function thSel(scope){
  var b = IDX.thermometer;
  if (!b) return null;
  var want = scope || THS;
  if (want === 'all' && b.all && b.all.series && b.all.series.length)
    return Object.assign({}, b, b.all, { scope: 'all', companies: 1, ncos: b.companies });
  if (b.series && b.series.length) return Object.assign({}, b, { scope: '200', ncos: b.companies });
  if (b.all && b.all.series && b.all.series.length)
    return Object.assign({}, b, b.all, { scope: 'all', companies: 1, ncos: b.companies });
  return null;
}

/* La frase di oggi: quanti, quanto, e dove sta rispetto alla storia. */
function thReading(th){
  var n = th.now, y0 = th.series.length ? th.series[0].m.slice(0, 4) : '';
  if (n.r == null) return T(
    'Negli ultimi tre mesi gli insider che hanno comprato o venduto sono meno di ' + th.min_people +
    ': troppo pochi per una lettura.',
    'In the last three months fewer than ' + th.min_people + ' insiders bought or sold: too few for a reading.');
  var it = th.scope === 'all'
    ? 'In tutto il mercato, dal ' + thDay(n.from) + ', ' + thN(n.b) + ' volte un amministratore o un dirigente ha comprato ' +
      'azioni della propria azienda in un mese, e ' + thN(n.s) + ' volte ne ha vendute: i compratori sono il ' + pc1(n.r) + '.'
    : 'Dal ' + thDay(n.from) + ' a oggi ' + thN(n.b) + ' insider hanno comprato azioni della propria azienda e ' +
      thN(n.s) + ' ne hanno vendute fuori dai piani programmati: i compratori sono il ' + pc1(n.r) + '.';
  var en = th.scope === 'all'
    ? 'Across the whole market, since ' + thDay(n.from) + ', a director or officer bought shares in their own company ' +
      thN(n.b) + ' times in a month, and sold ' + thN(n.s) + ' times: buyers are ' + pc1(n.r) + '.'
    : 'From ' + thDay(n.from) + ' to today ' + thN(n.b) + ' insiders bought shares in their own company and ' +
      thN(n.s) + ' sold outside pre-arranged plans: buyers are ' + pc1(n.r) + '.';
  if (n.pct != null && n.median != null) {
    var lowIt = n.pct < 50;
    it += ' È una quota ' + (lowIt ? 'più bassa che ' + nelPct(100 - n.pct) : 'più alta che ' + nelPct(n.pct)) +
      ' dei mesi dal ' + y0 + ' (la mediana è ' + pc1(n.median) + ').';
    en += ' That share is ' + (lowIt ? 'lower than in ' + (100 - n.pct) : 'higher than in ' + n.pct) +
      '% of months since ' + y0 + ' (the median is ' + pc1(n.median) + ').';
  }
  return T(it, en);
}

/* Che cosa dice la prova, a sei mesi: la pendenza e il suo t. */
function thVerdict(th){
  var t = th.test, h = t && t.h && t.h['6'];
  if (!t || !h || h.slope == null) {
    var n = h ? h.n : 0;
    return T('La prova vuole almeno 24 mesi con i sei mesi dopo già passati: per ora ne ha ' + n + '.',
             'The test needs at least 24 months whose following six months have already passed: so far it has ' + n + '.');
  }
  var big = h.t != null && Math.abs(h.t) >= 2;
  if (!big) return T(
    'Fra la quota di compratori e la borsa dei sei mesi dopo non c’è un legame più forte di quanto il caso ' +
    'spieghi: ' + sg(h.slope, 1) + ' punti di rendimento per ogni 10 punti di quota in più (t = ' + nu(h.t.toFixed(1)) + ').',
    'Between the share of buyers and the market over the following six months there is no link stronger than ' +
    'chance explains: ' + sg(h.slope, 1) + ' points of return for every 10 extra points of share (t = ' + h.t.toFixed(1) + ').');
  return T(
    'Nei mesi con più compratori la borsa ha fatto ' + (h.slope > 0 ? 'meglio' : 'peggio') + ' nei sei mesi dopo: ' +
    sg(h.slope, 1) + ' punti per ogni 10 punti di quota in più (t = ' + nu(h.t.toFixed(1)) + '), più di quanto il ' +
    'caso spieghi di solito.',
    'In months with more buyers the market did ' + (h.slope > 0 ? 'better' : 'worse') + ' over the following six ' +
    'months: ' + sg(h.slope, 1) + ' points for every 10 extra points of share (t = ' + h.t.toFixed(1) + '), more than ' +
    'chance usually explains.');
}

/* Sulla Home: il numero di oggi, la frase, e la linea dei dieci anni senza assi. */
function thHome(){
  var th = thSel('all');

  var sp = '';
  if (pts.length > 1) {
    var w = 600, h = 64, lo = Math.min.apply(null, pts.map(function(r){ return r.r; })),
        hi = Math.max.apply(null, pts.map(function(r){ return r.r; })), rg = (hi - lo) || 1;
    var P = function(i, v){ return (i / (pts.length - 1) * w).toFixed(1) + ',' + (h - 6 - (v - lo) / rg * (h - 12)).toFixed(1); };
    var med = n.median != null ? (h - 6 - (n.median - lo) / rg * (h - 12)).toFixed(1) : null;
    sp = '<svg class="thsp" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      (med != null ? '<line x1="0" x2="' + w + '" y1="' + med + '" y2="' + med + '" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>' : '') +
      '<polyline points="' + pts.map(function(r, i){ return P(i, r.r); }).join(' ') +
      '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>' +
      '<div class="thspx"><span>' + esc(thMonth(pts[0].m)) + '</span><span>' +
      esc(T('tratteggio: la mediana', 'dashes: the median')) + '</span><span>' + esc(T('oggi', 'today')) + '</span></div>';

    '<div class="thh"><div class="thn"><b>' + pc1(n.r) + '</b><span>' +
    esc(th.scope === 'all'
      ? T('degli insider che hanno comprato o venduto negli ultimi tre mesi, in tutto il mercato',
          'of the insiders who bought or sold in the last three months, across the whole market')
      : T('dei ' + thN(n.b + n.s) + ' insider attivi negli ultimi tre mesi ha comprato',
          'of the ' + thN(n.b + n.s) + ' insiders active in the last three months bought')) + '</span></div>' +
    '<div class="thw"><p>' + esc(thReading(th)) + '</p>' + sp + '</div></div>' +
    '<div class="cta" style="margin-top:12px"><a class="btn ghost" href="#termometro">' +
    T('La storia e la prova', 'The history and the test') + '</a></div></div>';
}

      ' at six (t ' + sg(h6.t, 1) + ') for every 10 points of share. Spearman rank correlation: ' +

  return '<div class="card" id="th"><h2>' + T('Il termometro degli insider', 'The insider thermometer') +

      'Tutte le ' + th.companies + ' aziende insieme. Ogni fine mese si contano gli insider che negli ultimi tre ' +
      'mesi hanno comprato azioni della propria azienda sul mercato e quelli che ne hanno vendute fuori dai ' +
      'piani 10b5-1, una volta per persona. Il termometro è la quota di compratori. Le vendite sono sempre ' +
      'molte di più (stipendi pagati in azioni, tasse, diversificazione): conta se la quota è alta o bassa ' +
      'rispetto alla sua storia. Negli studi classici (Seyhun, 1988 e 1992; Lakonishok e Lee, 2001) gli ' +
      'insider nel loro insieme comprano di più dopo i cali, e la borsa nei mesi dopo è andata meglio della media.',

      'last three months bought shares in their own company on the open market and those who sold outside ' +
      '10b5-1 plans, once per person. The thermometer is the share of buyers. Sales always far outnumber ' +
      'purchases (pay in shares, taxes, diversification): what matters is whether the share is high or low ' +

    '<div class="evw" id="thw"><div class="evtip" id="thtip" hidden></div></div>' +
    (t ? '<h3 class="thh3">' + T('La prova: che cosa ha fatto la borsa dopo', 'The test: what the market did next') + '</h3>' +
      '<p class="sub">' + T(
        'Il rendimento dello ' + th.market + ' (l’S&P 500) dal giorno ' + th.start_day + ' del mese dopo ogni ' +

      '<p class="evr">' + esc(thVerdict(th)) + '</p>' : '') +
    '<p class="sub" style="margin-top:12px">' + T(
      'Con rendimenti a sei mesi che si sovrappongono, ' + (h6 ? h6.n : 0) + ' mesi valgono circa ' + indep + ' prove ' +
      'indipendenti al massimo: l’errore standard della retta ne tiene conto (Newey-West), ma il risultato va ' +
      'letto con questa misura. Nella prova entrano i mesi chiusi' +
      (th.scope === 'all' ? ' e già letti per intero' : ' con almeno il 90% delle aziende coperte') +
      (t && t.from ? ', da ' + thMonth(t.from) + ' a ' + thMonth(t.to) : '') + '. La lettura non si dà se gli ' +
      'insider attivi sono meno di ' + th.min_people + '. Il termometro non entra nel punteggio delle aziende: ' +

      (t && t.from ? ', from ' + thMonth(t.from) + ' to ' + thMonth(t.to) : '') + '. No reading is given with ' +
      'fewer than ' + th.min_people + ' active insiders. The thermometer does not enter the companies’ scores: ' +
      'it describes the market, not which company to pick.') + '</p></div>';
}

/* Il disegno: una linea, la mediana tratteggiata, l'ultimo mese vuoto perché è in corso. */
function thDraw(){
  var th = IDX && thSel(), box = document.getElementById('thw');
  if (!th || !box) return;
  var S = th.series, N = S.length;
  var W = Math.max(280, box.clientWidth), narrow = W < 480;
  var H = narrow ? 210 : 250, m = { l: narrow ? 40 : 46, r: narrow ? 14 : 20, t: 16, b: 30 };
  var vals = S.filter(function(r){ return r.r != null; }).map(function(r){ return r.r; });
  if (!vals.length) return;
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = Math.max(hi - lo, 1);
  var step = [0.5, 1, 2, 2.5, 5, 10, 20].filter(function(x){ return span / x <= 5; })[0] || 25;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (hi === lo) hi = lo + step;
  var X = function(i){ return m.l + (N > 1 ? i / (N - 1) : 0.5) * (W - m.l - m.r); };
  var Y = function(v){ return m.t + (hi - v) / (hi - lo) * (H - m.t - m.b); };
  var g = '';
  for (var v = lo; v <= hi + 1e-9; v += step) {
    g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (m.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" class="evax">' + nu(v.toFixed(step < 1 ? 1 : 0)) + '%</text>';
  }
  // gennaio di ogni anno (uno sì e uno no se lo spazio è poco)
  var years = [];
  S.forEach(function(r, i){ if (r.m.slice(5) === '01') years.push(i); });
  var every = (narrow ? 2 : 1) * (years.length > 14 ? 2 : 1);
  years.forEach(function(i, j){
    if (j % every) return;
    g += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + (H - m.b) + '" y2="' + (H - m.b + 4) + '" stroke="var(--axis)"/>' +
      '<text x="' + X(i) + '" y="' + (H - m.b + 17) + '" text-anchor="middle" class="evax">' + S[i].m.slice(0, 4) + '</text>';
  });
  g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (H - m.b) + '" y2="' + (H - m.b) + '" stroke="var(--axis)"/>';
  if (th.now.median != null) {
    g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(th.now.median) + '" y2="' + Y(th.now.median) +
      '" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="4 4"/>';
  }
  // la linea, a tratti: piena dove la copertura basta, tratteggiata dove no, interrotta dove manca la lettura
  var full = function(r){ return r.co >= th.cover_min * th.companies; };
  var seg = [], segs = [];
  S.forEach(function(r, i){
    if (r.r == null) { if (seg.length) segs.push(seg); seg = []; return; }
    if (seg.length && full(S[seg[seg.length - 1]]) !== full(r)) { segs.push(seg); seg = [seg[seg.length - 1]]; }
    seg.push(i);
  });
  if (seg.length) segs.push(seg);
  segs.forEach(function(sg_){
    var ok = full(S[sg_[sg_.length - 1]]);
    g += '<polyline points="' + sg_.map(function(i){ return X(i).toFixed(1) + ',' + Y(S[i].r).toFixed(1); }).join(' ') +
      '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' +
      (ok ? '' : ' stroke-dasharray="2 4" stroke-opacity=".7"') + '/>';
  });
  var last = S[N - 1];
  if (last.r != null) {
    g += '<circle cx="' + X(N - 1) + '" cy="' + Y(last.r) + '" r="4.5" fill="' + (last.part ? 'var(--card)' : 'var(--c1)') +
      '" stroke="var(--c1)" stroke-width="2"/>';
  }
  g += '<g id="thhair" style="display:none"><line id="thhl" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="var(--ink2)" stroke-width="1"/>' +
    '<circle id="thhd" r="4" fill="var(--c1)" stroke="var(--card)" stroke-width="2"/></g>';
  var label = T('Quota di compratori fra gli insider attivi, finestra mobile di tre mesi, dal ',
                'Share of buyers among active insiders, rolling three-month window, from ') + thMonth(S[0].m) +
    T(' a ', ' to ') + thMonth(last.m);
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" tabindex="0" aria-label="' +
    esc(label + '. ' + thReading(th)) + '">' + g + '<rect x="' + m.l + '" y="0" width="' + (W - m.l - m.r) +
    '" height="' + H + '" fill="transparent"/></svg>';
  var tip = document.getElementById('thtip');
  [].forEach.call(box.querySelectorAll('svg'), function(n){ n.remove(); });
  box.insertAdjacentHTML('afterbegin', svg);
  var el = box.querySelector('svg');
  var showI = function(i){
    if (i == null) { document.getElementById('thhair').style.display = 'none'; tip.hidden = true; return; }
    i = Math.max(0, Math.min(N - 1, i)); THK = i;
    var r = S[i], x = X(i);
    document.getElementById('thhair').style.display = '';
    var hl = document.getElementById('thhl'); hl.setAttribute('x1', x); hl.setAttribute('x2', x);
    var dot = document.getElementById('thhd');
    if (r.r == null) dot.style.display = 'none';
    else { dot.style.display = ''; dot.setAttribute('cx', x); dot.setAttribute('cy', Y(r.r)); }
    tip.innerHTML = '<div class="evth">' + esc(T('Tre mesi fino a ', 'Three months to ') + thMonth(r.m)) +
      (r.part ? ' · ' + esc(T('in corso', 'in progress')) : '') + '</div>' +
      '<div><i style="background:var(--c1)"></i>' + esc(T('Compratori: ', 'Buyers: ')) + '<b>' + pc1(r.r) + '</b></div>' +
      '<div class="nm">' + thN(r.b) + ' ' + T('compratori', 'buyers') + ', ' + thN(r.s) + ' ' + T('venditori', 'sellers') +
      (th.scope === 'all' ? '' : ' · ' + r.co + ' ' + T('aziende', 'companies')) + '</div>';
    tip.hidden = false;
    var tw = tip.offsetWidth, left = x + 14;
    if (left + tw > W - 4) left = Math.max(4, x - 14 - tw);
    tip.style.left = left + 'px';
    tip.style.top = m.t + 'px';
  };
  var fromEvent = function(e){
    var rc = el.getBoundingClientRect(), px = (e.clientX - rc.left) * (W / rc.width);
    return Math.round((px - m.l) / (W - m.l - m.r) * (N - 1));
  };
  el.addEventListener('pointermove', function(e){ showI(fromEvent(e)); });
  el.addEventListener('pointerdown', function(e){ showI(fromEvent(e)); });
  el.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') showI(null); });
  el.addEventListener('blur', function(){ showI(null); });
  el.addEventListener('keydown', function(e){
    var i = THK == null ? N - 1 : THK;
    if (e.key === 'ArrowRight') { showI(i + (e.shiftKey ? 12 : 1)); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { showI(i - (e.shiftKey ? 12 : 1)); e.preventDefault(); }
    else if (e.key === 'Escape') { showI(null); }
  });
}

function thMount(){

  THK = null;
  thDraw();

      'Sales are left out: there are far more of them and they rarely mean much. The Italian feed is ') +
    '<code>' + esc(url.replace(/feed(-en)?\.xml$/, LANG === 'en' ? 'feed.xml' : 'feed-en.xml')) + '</code>.</p></div>';
}
function alertsMount(){
  var b = document.getElementById('feedcopy');
  if (!b) return;
  b.addEventListener('click', function(){
    var code = document.getElementById('feedurl'), done = function(){
      b.textContent = T('Copiato', 'Copied');
      setTimeout(function(){ b.textContent = T('Copia l’indirizzo', 'Copy the address'); }, 1600);
    };
    var pick = function(){                     // se gli appunti non si possono usare, si seleziona il testo
      var r = document.createRange(); r.selectNodeContents(code);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    try {
      navigator.clipboard.writeText(code.textContent).then(done, pick);
    } catch (e) { pick(); }
  });
}

/* ------------------------------------------------------------------ radar di tutto il mercato
   Gli acquisti degli insider di tutte le società americane negli ultimi 90
   giorni, dai file della SEC (pipeline/mercato.py). Il file è a parte,
   radar.json, perché sono centinaia di aziende. */
var RADAR = null, RF = 'tutte', RQ = '', RMORE = 60, ROPEN = {};

function radarTiles(r){
  var cs = r.companies || [];
  return '<div class="tiles">' +
    statTile(thN(cs.length), T('aziende con acquisti', 'companies with buying'),
             T('ultimi ' + r.window + ' giorni', 'last ' + r.window + ' days')) +
    statTile(thN(cs.filter(function(c){ return c.cluster; }).length), T('cluster', 'clusters'),
             T('3+ compratori in 30 giorni', '3+ buyers in 30 days')) +
    statTile(thN(cs.filter(function(c){ return c.senior; }).length), T('con un dirigente apicale', 'with a top executive'),
             T('CEO, CFO o presidente', 'CEO, CFO or president')) +
    (r.pending && r.last_q
      ? statTile((r.read || 0) + '/' + ((r.read || 0) + r.pending), T('giorni letti dal ' + day(r.last_q), 'days read since ' + day(r.last_q)),
                 T('dal più recente: gli altri ai prossimi giri', 'newest first: the rest in the next runs'))
      : statTile(r.through ? esc(day(r.through)) : '—', T('depositi letti fino al', 'filings read up to'), T('nessun buco', 'no gaps'))) +
  '</div>';
}

function radarRows(r){
  var q = RQ.trim().toLowerCase();
  return (r.companies || []).filter(function(c){
    if (RF === 'cluster' && !c.cluster) return false;
    if (RF === 'senior' && !c.senior) return false;
    if (RF === 'nostre' && !c.ours) return false;
    if (q && (c.t || '').toLowerCase().indexOf(q) < 0 && (c.name || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function radarTable(r){
  var rows = radarRows(r), shown = rows.slice(0, RMORE);
  if (!rows.length) return '<p class="sub" style="margin-top:12px">' +
    T('Nessuna azienda con questi filtri.', 'No company with these filters.') + '</p>';
  var edgar = function(c){
    return 'https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=' + encodeURIComponent(c.cik) + '&type=4';
  };
  return '<div class="scroll" style="margin-top:12px"><table class="t-narrow rdt"><thead><tr><th>' + T('Azienda', 'Company') +
    '</th><th class="num">' + T('Compratori', 'Buyers') + '</th><th class="num">' + T('Comprato', 'Bought') +
    '</th><th class="num hide-s">' + T('Ultimo acquisto', 'Last purchase') + '</th><th class="hide-s">' +
    T('Chi ha comprato di più', 'Biggest buyer') + '</th></tr></thead><tbody>' +
    shown.map(function(c, i){
      var key = c.t || c.cik, open = ROPEN[key], w = c.who[0] || {};
      var chips = (c.cluster ? '<span class="chip good">cluster</span> ' : '') +
        (c.ours ? '<span class="chip">' + T('seguita', 'followed') + '</span> ' : '');
      var row = '<tr data-rk="' + esc(key) + '" aria-expanded="' + !!open + '"><td><span class="tk">' + esc(c.t || '—') +
        '</span> ' + chips + '<div class="nm">' + esc(c.name) + '</div></td>' +
        '<td class="num">' + c.buyers + '</td><td class="num">' + money(c.value) +
        (c.big_value ? '<div class="nm">' + T('+ ', '+ ') + money(c.big_value) + ' ' + T('da grandi azionisti', 'by large holders') + '</div>' : '') +
        '</td><td class="num hide-s">' + esc(day(c.last)) + '</td><td class="hide-s">' + esc(w.who || '') +
        '<div class="nm">' + esc(w.role || '') + '</div></td></tr>';
      if (!open) return row;
      return row + '<tr class="rdx"><td colspan="5"><div class="rdd">' +
        '<table class="t-narrow"><tbody>' + c.who.map(function(p){
          return '<tr style="cursor:default"><td>' + esc(p.who) + '<div class="nm">' + esc(p.role) + '</div></td>' +
            '<td class="num">' + money(p.v) + '<div class="nm">' + T('ultimo il ', 'last on ') + esc(day(p.last)) + '</div></td></tr>';
        }).join('') + '</tbody></table>' +
        '<p class="sub" style="margin:8px 0 0">' + T(
          c.n + ' acquisti dal ' + day(c.first) + ' al ' + day(c.last) + ', a $' + n2(c.avg_price) + ' in media per azione.',
          c.n + ' purchases from ' + day(c.first) + ' to ' + day(c.last) + ', at $' + n2(c.avg_price) + ' a share on average.') +
        ' ' + (c.ours ? '<a href="#' + esc(c.t) + '">' + T('Apri la scheda', 'Open the page') + '</a> · ' : '') +
        '<a href="' + edgar(c) + '" target="_blank" rel="noopener">' + T('I Form 4 alla SEC', 'The Form 4s at the SEC') + '</a></p>' +
        '</div></td></tr>';
    }).join('') + '</tbody></table></div>' +
    (rows.length > shown.length ? '<div style="margin-top:12px"><button type="button" id="rdmore">' +
      T('Mostra altre ' + Math.min(60, rows.length - shown.length), 'Show ' + Math.min(60, rows.length - shown.length) + ' more') +
      '</button> <span class="nm">' + T(shown.length + ' di ' + rows.length, shown.length + ' of ' + rows.length) + '</span></div>' : '');
}

function renderRadar(){
  if (!RADAR) {
    app.innerHTML = navBar('radar') + '<div class="card">' + T('Carico il radar…', 'Loading the radar…') + '</div>';
    fetch('radar.json?' + Date.now())
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){ RADAR = j; renderRadar(); })
      .catch(function(){
        app.innerHTML = navBar('radar') + '<div class="card"><h1>' + T('Radar', 'Radar') + '</h1><p class="lead">' + T(
          'Il radar di tutto il mercato non è ancora pronto: lo prepara il workflow «Tutto il mercato», che scarica ' +
          'i file della SEC ogni tre ore. Il primo giro dura circa un’ora.',
          'The whole-market radar is not ready yet: the “Tutto il mercato” workflow prepares it, downloading the SEC ' +
          'files every three hours. The first run takes about an hour.') + '</p></div>';
      });
    return;
  }
  var r = RADAR;
  var pills = [['tutte', T('Tutte', 'All')], ['cluster', T('Solo cluster', 'Clusters only')],
               ['senior', T('Con un dirigente apicale', 'With a top executive')], ['nostre', T('Solo quelle seguite', 'Followed only')]];
  app.innerHTML = navBar('radar') +
    '<div class="card hero"><h1>' + T('Radar: tutto il mercato', 'Radar: the whole market') + '</h1><p class="lead">' + T(
      'Le ' + NCO() + ' aziende del sito sono una scelta. Qui ci sono tutte le società americane in cui, negli ultimi ' +
      r.window + ' giorni, amministratori e dirigenti hanno comprato azioni sul mercato per almeno ' + money(r.min_value) +
      ' in tutto. Prima i cluster, poi le aziende con più compratori.',
      'The ' + NCO() + ' companies on this site are a selection. Here are all the US companies where, in the last ' +
      r.window + ' days, directors and officers bought shares on the open market for at least ' + money(r.min_value) +
      ' in all. Clusters first, then the companies with the most buyers.') + '</p>' + radarTiles(r) +
    '<p class="sub">' + T(
      'Dai file della SEC: i data set trimestrali dei Form 4 e, per i giorni dopo, l’indice giornaliero di EDGAR, ' +
      'letto la sera. Il radar è quindi di ieri sera, non dell’ultima ora. Senza punteggio: le aziende fuori dalle ' +
      NCO() + ' non hanno prezzi, short interest e call nel sistema.',
      'From the SEC files: the quarterly Form 4 data sets and, for the days after, the EDGAR daily index, read in the ' +
      'evening. So the radar is as of last night, not the last hour. No score: companies outside the ' + NCO() + ' have ' +
      'no prices, short interest or calls in the system.') + '</p></div>' +
    '<div class="card"><div class="evp" role="group" aria-label="' + esc(T('Filtri', 'Filters')) + '">' + pills.map(function(p){
      return '<button type="button" class="gf" data-rf="' + p[0] + '" aria-pressed="' + (p[0] === RF) + '">' + esc(p[1]) + '</button>';
    }).join('') + '</div>' +
    '<div class="field" style="margin-top:12px;max-width:340px"><input id="rq" type="search" placeholder="' +
      esc(T('Cerca un ticker o un nome', 'Search a ticker or a name')) + '" value="' + esc(RQ) + '"></div>' +
    '<div id="rdt">' + radarTable(r) + '</div>' +
    '<p class="sub" style="margin-top:12px">' + T(
      'Un cluster è di almeno tre persone diverse entro 30 giorni. Contano gli acquisti sul mercato (codice P) a un ' +
      'prezzo di almeno ' + money(r.min_price) + ' per azione. Chi possiede più del 10% senza essere amministratore o ' +
      'dirigente (spesso un fondo) si mostra a parte e non porta un’azienda nel radar. Tocca una riga per i dettagli.',
      'A cluster is at least three different people within 30 days. Open-market purchases (code P) count, at a price ' +
      'of at least ' + money(r.min_price) + ' a share. Owners of more than 10% who are not directors or officers (often ' +
      'a fund) are shown apart and do not bring a company onto the radar. Tap a row for details.') + '</p></div>';
  radarMount();
}

function radarMount(){
  var redraw = function(){
    var box = document.getElementById('rdt');
    if (box) { box.innerHTML = radarTable(RADAR); radarRowsMount(); }
  };
  [].forEach.call(app.querySelectorAll('[data-rf]'), function(b){
    b.addEventListener('click', function(){
      RF = b.dataset.rf; RMORE = 60;
      [].forEach.call(app.querySelectorAll('[data-rf]'), function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      redraw();
    });
  });
  var q = document.getElementById('rq');
  if (q) q.addEventListener('input', function(){ RQ = q.value; RMORE = 60; redraw(); });
  radarRowsMount();
  function radarRowsMount(){
    [].forEach.call(app.querySelectorAll('tr[data-rk]'), function(tr){
      tr.addEventListener('click', function(ev){
        if (ev.target.closest('a')) return;
        ROPEN[tr.dataset.rk] = !ROPEN[tr.dataset.rk];
        redraw();
      });
    });
    var m = document.getElementById('rdmore');
    if (m) m.addEventListener('click', function(){ RMORE += 60; redraw(); });
  }
}

var SORT = { k: 'score', d: -1 };          // come arriva dalla pipeline
var Q = '';                                // testo cercato nell'elenco

function matches(c, q){
  if (!q) return true;
  q = q.toLowerCase();
  return c.ticker.toLowerCase().indexOf(q) >= 0 ||
         (c.name || '').toLowerCase().indexOf(q) >= 0;
}

function sortVal(c, k){
  if (k === 'ticker') return c.ticker;
  if (k === 'price')  return c.last ? c.last.c : null;
  if (k === 'buyers') return (c.buyers || 0) - (c.sellers || 0);
  return c[k];
}
function sortRows(rows){
  var k = SORT.k, d = SORT.d;
  return rows.slice().sort(function(a, b){
    var x = sortVal(a, k), y = sortVal(b, k);
    if (x === y) return a.ticker < b.ticker ? -1 : 1;   // ordine stabile e prevedibile
    if (x === null || x === undefined) return 1;        // i dati mancanti stanno in fondo
    if (y === null || y === undefined) return -1;
    return (typeof x === 'string' ? (x < y ? -1 : 1) : x - y) * d;
  });
}
function sortTh(k, label, cls){
  var on = SORT.k === k;
  return '<th class="' + (cls || '') + ' so' + (on ? ' on' : '') + '" data-k="' + k +
         '" tabindex="0" role="button" aria-sort="' +
         (on ? (SORT.d < 0 ? 'descending' : 'ascending') : 'none') + '">' +
         esc(label) + '<i>' + (on ? (SORT.d < 0 ? '↓' : '↑') : '') + '</i></th>';
}

/* Ogni frase nasce da un campo dei dati. Niente aggettivi che non hanno
   un numero dietro, e ogni affermazione porta il rimando alla sua fonte. */

function src(n, label){
  return '<sup class="src" data-src="' + n + '" title="' +
    T('vai alla fonte', 'go to the source') + '">' + (label || n) + '</sup>';
}
function sec(title, body){
  return body ? '<section class="mo"><h3>' + esc(title) + '</h3>' + body + '</section>' : '';
}
function med(xs){
  var s = xs.slice().sort(function(a, b){ return a - b; }), n = s.length;
  return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null;
}

function memoInsider(d){

    return t.date >= new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10); });

  var i9 = d.insider_90d || {}, p = [];

    var tr = (d.tracks || {})[big.who];
    p.push(T('Il segnale principale è l’acquisto di <b>' + esc(big.who) + '</b> (' +
      esc(big.role) + ') del ' + day(big.date) + ' per ' + money(big.value) + '.',

      ') on ' + day(big.date) + ' for ' + money(big.value) + '.') + src(1));
    if (big.is_senior) p.push(T(' È un dirigente apicale, e la formula lo conta come tale.',
                                ' They are a top executive, and the formula counts that.'));
    if (tr && tr.n) {
      var worse = tr.mult < 1;
      p.push(' ' + T('I suoi acquisti passati rendono in media ' + sg(tr.avg, 1) +
        '% a 60 giorni contro il settore, su ' + tr.n + (tr.n === 1 ? ' caso' : ' casi') +

        ' (×' + nu(tr.mult) + ').',

        'sector, across ' + tr.n + (tr.n === 1 ? ' case' : ' cases') + ': the weight of this ' +
        'purchase is ' + (worse ? 'cut' : 'raised') + ' (×' + nu(tr.mult) + ').') + src(1));
    }
    if (i9.buyers > 1) p.push(' ' + T('In tutto hanno comprato ' + i9.buyers + ' persone diverse.',
                                      'In all, ' + i9.buyers + ' separate people bought.') + src(1));
    if (i9.cluster) p.push(' ' + T('Sono abbastanza e abbastanza ravvicinate da formare un cluster.',
                                   'That is enough people, close enough together, to form a cluster.'));

  if (i9.sellers) p.push(' ' + T('Nello stesso periodo ' + i9.sellers +

      'informative: piani 10b5-1, ritenute fiscali, esercizi di opzioni.',
      zero + ' transactions in the same period were excluded as uninformative: 10b5-1 plans, tax ' +
      'withholding, option exercises.') + src(1));
  return '<p>' + p.join('') + '</p>';

function memoWords(d){
  var calls = d.calls || [];

  var last = calls[calls.length - 1], four = calls.slice(-4);
  var avg = Math.round(four.reduce(function(a, c){ return a + c.tone; }, 0) / four.length);
  var hi = four.reduce(function(a, c){ return c.tone > a.tone ? c : a; }, four[0]);
  var lo = four.reduce(function(a, c){ return c.tone < a.tone ? c : a; }, four[0]);
  var dirs = (last.guidance || []).map(function(g){ return g.direction; });
  var up = dirs.filter(function(x){ return x === 'alzata'; }).length;
  var dn = dirs.filter(function(x){ return x === 'ridotta'; }).length;
  var buys = (d.insider_90d || {}).buyers > 0;
  var p = [T('Il tono delle ultime ' + four.length + ' call è in media ' + avg +
    ' su 100, dal minimo di ' + lo.tone + ' (' + qShort(lo.quarter) + ') al massimo di ' +
    hi.tone + ' (' + qShort(hi.quarter) + ').',
    'The tone of the last ' + four.length + ' calls averages ' + avg + ' out of 100, from a low of ' +
    lo.tone + ' (' + qShort(lo.quarter) + ') to a high of ' + hi.tone + ' (' + qShort(hi.quarter) +
    ').') + src('call')];
  if (up || dn) {
    p.push(' ' + T('Nell’ultima call (' + qShort(last.quarter) + ') l’azienda ha alzato ' +
      up + (up === 1 ? ' voce' : ' voci') + ' di guidance e ne ha ' + (dn === 1 ? 'ridotta ' : 'ridotte ') +
      dn + '.',
      'In the latest call (' + qShort(last.quarter) + ') the company raised ' + up +
      (up === 1 ? ' guidance item' : ' guidance items') + ' and lowered ' + dn + '.') + src('call'));
    if (dn > up && buys) p.push(' ' + T('Gli insider hanno comprato mentre l’azienda abbassava ' +
      'le proprie previsioni: è la divergenza che questo strumento esiste per trovare.',
      'Insiders bought while the company was lowering its own forecasts: this is the divergence the ' +
      'tool exists to find.'));
    else if (up > dn && !buys) p.push(' ' + T('L’azienda alza le previsioni, ma nessun insider ' +
      'mette soldi propri.', 'The company raises its forecasts, but no insider is putting their own ' +
      'money in.'));
  }

  for (var i = calls.length - 1; i >= 0 && !chg; i--)
    if ((calls[i].language_changes || []).length) chg = calls[i].language_changes[0];

function memoMarket(d){

  if (d.si_pct != null) p.push(T('Lo short interest è il ' + nu(d.si_pct.toFixed(2)) +
    '% delle azioni in circolazione.', 'Short interest is ' + nu(d.si_pct.toFixed(2)) +
    '% of shares outstanding.') + src(3));
  p.push(' ' + T('Rispetto alla mediana dell’ultimo anno è ' + sg(dev, 1) +
    '%, e negli ultimi tre mesi ' + (mom >= 0 ? 'è salito del ' : 'è sceso del ') +

    'Against the median of the last year it is ' + sg(dev, 1) + '%, and over the last three months it ' +
    (mom >= 0 ? 'has risen by ' : 'has fallen by ') + nu(Math.abs(mom).toFixed(1)) + '%.') + src(3));
  var buys = (d.insider_90d || {}).buyers > 0;

    'le due scommesse sono opposte.',

    'insider comprano.', 'The bears are leaving over the same period in which insiders are buying.'));
  p.push(' ' + T('Giorni di scambi necessari a chi è short per uscire: ' + nu(last[2].toFixed(2)) + '.',
    'Days of trading the shorts would need to get out: ' + nu(last[2].toFixed(2)) + '.') + src(3));
  return '<p>' + p.join('') + '</p>';

function qLabel(q){
  q = String(q || '');
  if (LANG === 'en') q = q.replace(/^T(\d)/, 'Q$1').replace('(anno fiscale)', '(fiscal year)');
  return q;
}
function qShort(q){ return qLabel(q).replace(/\s*\(.*\)\s*/, ''); }

var DIRS = {
  alzata:     ['alzata', 'raised', 'good'],
  ridotta:    ['ridotta', 'lowered', 'warn'],
  confermata: ['confermata', 'confirmed', ''],
  prima:      ['data per la prima volta', 'first given', 'info']

function dots(n){

  return '<span class="dots" title="' + T('direttezza ', 'directness ') + n + '/5">' + out + '</span>';
}

/* grafico a linea: coppie [data, valore]. Scala in modo uniforme, niente testo stirato. */
function lineChart(pts, fmt, label){
  if (!pts || pts.length < 2) return '';
  var W = 600, H = 170, L = 56, R = 12, TT = 14, B = 26;
  var vs = pts.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), rg = (hi - lo) || 1;
  var x = function(i){ return L + i / (pts.length - 1) * (W - L - R); };
  var y = function(v){ return TT + (1 - (v - lo) / rg) * (H - TT - B); };
  var line = pts.map(function(p, i){
    return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join('');
  var area = line + 'L' + x(pts.length - 1).toFixed(1) + ',' + (H - B) +
             'L' + L + ',' + (H - B) + 'Z';
  var last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    esc(label || '') + '">' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) +
      '" stroke="var(--axis)" stroke-width="1"/>' +
    '<path d="' + area + '" fill="var(--blue)" opacity=".09"/>' +
    '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2"/>' +
    '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(last[1]).toFixed(1) +
      '" r="3.5" fill="var(--blue)"/>' +
    '<text x="' + (L - 8) + '" y="' + (y(hi) + 4).toFixed(1) + '" text-anchor="end">' + fmt(hi) + '</text>' +
    '<text x="' + (L - 8) + '" y="' + (y(lo) + 4).toFixed(1) + '" text-anchor="end">' + fmt(lo) + '</text>' +
    '<text x="' + L + '" y="' + (H - 8) + '">' + esc(day(pts[0][0])) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(day(last[0])) + '</text>' +
    '</svg>';
}

/* Utili contro attese, trimestre per trimestre (Alpha Vantage). Il segno della
   sorpresa è quello che il bonus "dopo una trimestrale sopra le attese" guarda. */

  var e = (d.earnings || []).slice().reverse(), nx = d.next_report;
  var beats = e.filter(function(r){ return r.sp != null && r.sp > 0; }).length,
      known = e.filter(function(r){ return r.sp != null; }).length;
  var money2 = function(v){ return (typeof v === 'number' && isFinite(v)) ? '$' + n2(v) : '—'; };
  return '<div class="card"><h2>' + T('Utili contro attese', 'Earnings against estimates') + '</h2>' +
    '<p class="sub">' + T(
      'L’utile per azione che l’azienda ha annunciato ogni trimestre, accanto a quello che si ' +
      'aspettavano gli analisti. È l’utile «rettificato», quello su cui si fanno le stime. ' +
      (known ? 'Sopra le attese ' + beats + ' volte su ' + known + '.' : ''),
      'The earnings per share the company reported each quarter, next to what analysts expected. It is ' +
      'the “adjusted” figure, the one estimates are made on. ' +
      (known ? 'Above expectations ' + beats + ' times out of ' + known + '.' : '')) +
    (nx ? ' ' + T('Prossima trimestrale il ' + day(nx.date) +
                  (nx.estimate != null ? ', con attese di $' + n2(nx.estimate) + ' per azione.' : '.'),
                  'Next results on ' + day(nx.date) +
                  (nx.estimate != null ? ', with estimates of $' + n2(nx.estimate) + ' a share.' : '.')) : '') +
    '</p><div class="scroll"><table class="t-narrow"><thead><tr><th>' + T('Annunciato il', 'Reported on') + '</th>' +
    '<th class="hide-s">' + T('Trimestre chiuso il', 'Quarter ended') + '</th>' +
    '<th class="num">' + T('Utile per azione', 'EPS') + '</th>' +
    '<th class="num">' + T('Attese', 'Estimate') + '</th>' +
    '<th class="num">' + T('Sorpresa', 'Surprise') + '</th></tr></thead><tbody>' +
    e.map(function(r){
      var col = r.sp == null ? 'inherit' : r.sp > 0 ? 'var(--bull2)' : r.sp < 0 ? 'var(--bear2)' : 'inherit';
      return '<tr style="cursor:default"><td>' + esc(day(r.d)) + '</td>' +
        '<td class="nm hide-s">' + esc(r.q ? day(r.q) : '—') + '</td>' +
        '<td class="num">' + money2(r.eps) + '</td>' +
        '<td class="num" style="color:var(--ink3)">' + money2(r.est) + '</td>' +
        '<td class="num" style="color:' + col + '"><b>' + (r.sp == null ? '—' : sg(r.sp, 1) + '%') +
        '</b></td></tr>';
    }).join('') + '</tbody></table></div>' +
