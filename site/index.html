<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conviction Engine</title>
<style>
  :root{color-scheme:light dark;--bg:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--line:#e1e0d9;--blue:#2a78d6}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#2c2c2a;--blue:#3987e5}}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 48px;background:var(--bg);color:var(--ink);
       font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:720px;margin:auto;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .score{font-size:64px;font-weight:650;letter-spacing:-.03em;line-height:1}
  .muted{color:var(--ink2);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue)}
</style>
<div class="wrap" id="app"><div class="card">Carico i dati…</div></div>
<script>
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('data.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{
  const s=d.score;
  $.innerHTML=
    '<div class="card"><h1>'+esc(d.company.name)+' ('+esc(d.company.ticker)+')</h1>'+
    '<div class="muted">Ultima chiusura '+esc(d.price.last.d)+': $'+d.price.last.c.toFixed(2)+
    ' · dati aggiornati il '+esc(d.generated_at.replace('T',' alle ').replace('+00:00',' UTC'))+'</div>'+
    '<div class="score">'+s.value+'<span class="muted" style="font-size:18px"> / 100</span></div>'+
    '<div><b>'+esc(s.verdict)+'</b> · confidenza '+esc(s.confidence.toLowerCase())+
    ' · copertura dei dati '+s.covered_pct+'%</div></div>'+
    '<div class="card"><h1>Sotto-punteggi</h1><table><tr><th>Voce</th><th class="num">Peso</th><th>Valore</th></tr>'+
    s.subs.map(x=>'<tr><td>'+esc(x.name)+'<br><span class="muted">'+esc((x.why||[])[0]||'')+'</span></td>'+
      '<td class="num">'+x.w+'%</td><td>'+(x.v===null?'<span class="muted">non disponibile</span>'
      :'<b>'+x.v+'</b><div class="bar"><i style="width:'+x.v+'%"></i></div>')+'</td></tr>').join('')+
    '</table></div>'+
    '<div class="card"><h1>Ultime operazioni degli insider</h1><table><tr><th>Data</th><th>Insider</th><th>Tipo</th><th class="num">Valore</th></tr>'+
    d.tx.slice(-12).reverse().map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.who)+'<br><span class="muted">'+esc(t.role)+'</span></td>'+
      '<td>'+esc(t.kind)+'<br><span class="muted">'+esc(t.read)+'</span></td>'+
      '<td class="num">$'+Math.round(t.value).toLocaleString('it-IT')+'</td></tr>').join('')+
    '</table></div>'+
    '<div class="card muted">Fonti: '+d.sources.map(x=>esc(x.t)+' ('+esc(x.m)+')').join(' · ')+
    '<br>Strumento didattico, non e’ una raccomandazione di investimento.</div>';
}).catch(e=>{$.innerHTML='<div class="card">Nessun <code>data.json</code> ancora. Fai girare <code>python -m pipeline.build</code> oppure il workflow <b>Aggiorna i dati</b>.<br><span class="muted">'+esc(e)+'</span></div>';});
</script>
