<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conviction Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap">
<style>
  :root{color-scheme:light dark;
    --bg:#f9f9f7;--card:#fff;--sunken:#f2f1ec;--ink:#0b0b0b;--ink2:#52514e;--ink3:#86857e;
    --line:#e1e0d9;--axis:#cfcec6;--blue:#2a78d6;--bull:#2a78d6;--bear:#c0392b;--mid:#86857e;
    --good:#1b7f4b;--goodbg:#e6f3ec;--warnbg:#fdf2e3;--warnink:#8a5a12;--infobg:#e8f0fb}
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d0d0d;--card:#1a1a19;--sunken:#242422;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8e8d85;
    --line:#2c2c2a;--axis:#3d3d3a;--blue:#3987e5;--bull:#3987e5;--bear:#e06354;--mid:#8e8d85;
    --good:#4ab87a;--goodbg:#15301f;--warnbg:#3a2a12;--warnink:#f0c478;--infobg:#132236}}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 56px;background:var(--bg);color:var(--ink);
       font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:auto;display:grid;gap:16px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  h2{font-size:15px;margin:0 0 2px}
  .sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  button{appearance:none;border:1px solid var(--axis);background:var(--card);color:var(--ink);
         border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  button:hover{border-color:var(--ink3)}
  button[disabled]{opacity:.5;cursor:default}
  .langbar{display:flex;justify-content:flex-end;margin:-6px 0 -6px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
  .lang button{border:0;border-radius:0;background:transparent;color:var(--ink2);
               padding:5px 13px;font-family:inherit;font-size:12px;font-weight:650;line-height:1.4;letter-spacing:.04em}
  .lang button+button{border-left:1px solid var(--line)}
  .lang button[aria-pressed="true"]{background:var(--sunken);color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:440px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);
     text-align:left;padding:0 8px 8px;font-weight:600}
  td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--sunken)}
  .tk{font-weight:650}
  .nm{color:var(--ink2);font-size:12.5px}
  .sc{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .sc b{font-size:16px;font-weight:650;min-width:26px;display:inline-block;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;
        font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink2);white-space:nowrap}
  .chip.good{background:var(--goodbg);color:var(--good)}
  .chip.info{background:var(--infobg);color:var(--blue)}
  .chip.warn{background:var(--warnbg);color:var(--warnink)}
  .warn-card{background:var(--warnbg);color:var(--warnink);border:0}
  .warn-card ul{margin:8px 0 0;padding-left:18px}
  .warn-card li{font-size:13px;margin:3px 0;word-break:break-word}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px;width:100%}
  .bar i{display:block;height:100%}
  .big{font-size:56px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:6px 0 2px}
  .subs li{list-style:none;display:grid;grid-template-columns:150px 54px minmax(0,1fr);
           gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
  .subs{margin:0;padding:0}
  .subs li:first-child{border-top:0}
  .subs .w{color:var(--ink2);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .subs p{margin:0;font-size:13px;color:var(--ink2)}
  .subs b{font-size:13.5px}
  .scroll{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
  .back{margin-bottom:2px}
  .gf{padding:6px 12px;font-size:12.5px}
  .spark{width:100%;height:56px;display:block}
  @media (max-width:620px){
    .hide-s{display:none}
    .subs li{grid-template-columns:minmax(0,1fr) 54px}
    .subs p{grid-column:1/-1}
  }
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--ink2);
               padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:600;
               border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
  .tabs button:hover{color:var(--ink);border-color:transparent}
  .tabs button[aria-selected="true"]:hover{border-bottom-color:var(--blue)}
  .chart{width:100%;height:auto;display:block;margin-top:6px}
  .chart text{font:11px Inter,system-ui,sans-serif;fill:var(--ink3)}
  .bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;margin-top:12px}
  .bars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
  .bars i{display:block;border-radius:3px 3px 0 0}
  .bars b{font-size:12px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
  .bars span{font-size:10.5px;color:var(--ink3);text-align:center;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .chg{border-left:2px solid var(--axis);padding:2px 0 2px 12px;margin:14px 0}
  .chg .ft{font-size:13px;color:var(--ink2);margin-top:4px}
  .chg .ft i{font-style:normal;color:var(--ink3)}
  .chg .nt{font-size:12.5px;color:var(--ink2);margin-top:5px}
  .qa{border-top:1px solid var(--line);padding:11px 0}
  .qa:first-of-type{border-top:0}
  .qa .q{font-size:13.5px;font-weight:600}
  .qa .a{font-size:13px;color:var(--ink2);margin-top:3px}
  .dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:7px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--blue)}
  .nav{display:flex;gap:2px;flex-wrap:wrap;margin:0 0 2px}
  .nav a{padding:8px 15px;border-radius:99px;font-family:inherit;font-size:13.5px;font-weight:600;
         color:var(--ink2);text-decoration:none}
  .nav a:hover{background:var(--sunken);color:var(--ink)}
  .nav a.on{background:var(--ink);color:var(--bg)}
  .hero h1{font-size:28px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.2}
  .lead{font-size:15.5px;line-height:1.6;color:var(--ink2);margin:0 0 4px;max-width:64ch}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:20px 0 14px}
  .tile{background:var(--sunken);border-radius:10px;padding:14px}
  .tile b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1;
          font-variant-numeric:tabular-nums}
  .tile span{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
  .tile em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:2px}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{display:inline-block;background:var(--ink);color:var(--bg);border:1px solid var(--ink);
       border-radius:8px;padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:600;
       text-decoration:none;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--axis)}
  .btn:hover{opacity:.87}
  .steps{counter-reset:s;list-style:none;margin:0;padding:0}
  .steps li{counter-increment:s;position:relative;padding:14px 0 14px 46px;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0}
  .steps li::before{content:counter(s);position:absolute;left:0;top:15px;width:28px;height:28px;
    border-radius:50%;background:var(--sunken);color:var(--ink2);font-size:13px;font-weight:650;
    display:grid;place-items:center}
  .steps b{font-size:14.5px}
  .steps p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.55}
  .faq{border-top:1px solid var(--line)}
  .faq:first-of-type{border-top:0}
  .faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:14px;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:'+';display:inline-block;width:18px;color:var(--ink3);font-weight:400}
  .faq[open] summary::before{content:'\2013'}
  .faq p{margin:0 0 14px 18px;font-size:13.5px;color:var(--ink2);line-height:1.55}
  .field{margin:14px 0}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
  .field input,.field textarea{width:100%;background:var(--card);color:var(--ink);
    font-family:inherit;font-size:14px;line-height:1.5;
    border:1px solid var(--axis);border-radius:8px;padding:10px 12px;resize:vertical}
  .field input{text-transform:uppercase}
  .field input::placeholder,.field textarea::placeholder{text-transform:none;color:var(--ink3)}
  .field input:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;
    border-color:var(--blue)}
  ul.plain{margin:10px 0 0;padding-left:18px}
  ul.plain li{font-size:13.5px;color:var(--ink2);margin:7px 0;line-height:1.5}
  @media (max-width:620px){.hero h1{font-size:23px}.tile b{font-size:25px}}
</style>
<div class="wrap">
  <div class="langbar"><div class="lang" id="lang" role="group" aria-label="Lingua / Language">
    <button type="button" data-l="it" aria-pressed="false">IT</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div></div>
  <div id="app"><div class="card">…</div></div>
</div>
<script>
/* ------------------------------------------------------------------ lingua */
var LANGS = ['it', 'en'], LOCS = { it: 'it-IT', en: 'en-GB' }, LANG, LI, LOC;
function readLang(){
  var v = null;
  try { v = localStorage.getItem('ce-lang'); } catch (e) {}
  if (LANGS.indexOf(v) < 0) v = /^it\b/i.test(navigator.language || '') ? 'it' : 'en';
  return v;
}
function setLang(v){
  LANG = LANGS.indexOf(v) < 0 ? 'en' : v;
  LI = LANGS.indexOf(LANG);
  LOC = LOCS[LANG];
  document.documentElement.lang = LANG;
  try { localStorage.setItem('ce-lang', LANG); } catch (e) {}
  [].forEach.call(document.querySelectorAll('#lang button'), function(b){
    b.setAttribute('aria-pressed', String(b.dataset.l === LANG));
  });
}
/* T('italiano','english') sceglie la stringa della lingua attiva */
function T(){ return arguments[LI] !== undefined ? arguments[LI] : arguments[0]; }
/* txt() accetta sia una stringa semplice sia {it:…, en:…} prodotto dalla pipeline */
function txt(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[LANG] || v.it || v.en || '';
}
function key(v){ return typeof v === 'string' ? v : (v && v.it) || ''; }
var WORDS = {
  Alta: 'high', Media: 'medium', Bassa: 'low', Assente: 'none',
  alta: 'high', media: 'medium', bassa: 'low', assente: 'none'
};
function wd(s){ s = String(s || ''); return LANG === 'it' ? s.toLowerCase() : (WORDS[s] || s.toLowerCase()); }

/* ------------------------------------------------------------------ formato */
var app = document.getElementById('app'), IDX = null, CACHE = {}, GRP = '', CUR = '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function n2(v){ return (typeof v === 'number' && isFinite(v)) ? nu(v.toFixed(2)) : '—'; }
function nu(s){ return LANG === 'it' ? String(s) : String(s).replace(',', '.'); }
function sg(v, d){ return (typeof v === 'number' && isFinite(v))
  ? (v > 0 ? '+' : v < 0 ? '−' : '') + nu(Math.abs(v).toFixed(d === undefined ? 2 : d)) : '—'; }
function money(v){ return (typeof v === 'number' && isFinite(v))
  ? '$' + Math.round(v).toLocaleString(LOC) : '—'; }
function when(s){
  var d = new Date(String(s || ''));
  if (isNaN(d.getTime())) return String(s || '');
  var day = d.toLocaleDateString(LOC, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
  var hm = d.toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });
  return day + T(' alle ', ' at ') + hm + ' UTC';
}
function day(s){
  var d = new Date(String(s || '') + 'T00:00:00Z');
  if (isNaN(d.getTime())) return String(s || '');
  return d.toLocaleDateString(LOC, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function tone(v){ return v == null ? 'var(--mid)' : v >= 65 ? 'var(--bull)' : v < 35 ? 'var(--bear)' : 'var(--mid)'; }
function scoreCell(v){
  return '<span class="sc"><span class="dot" style="background:' + tone(v) + '"></span>' +
         '<b>' + (v == null ? '—' : v) + '</b></span>';
}
function problems(list){
  if (!list || !list.length) return '';
  return '<div class="card warn-card"><b>' +
    T('La raccolta dei dati ha avuto problemi', 'Something went wrong while collecting the data') +
    '</b><ul>' + list.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
}
function spark(series){
  if (!series || series.length < 2) return '';
  var w = 600, h = 56, cs = series.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, cs), hi = Math.max.apply(null, cs), rg = (hi - lo) || 1;
  var d = series.map(function(p, i){
    return (i ? 'L' : 'M') + (i / (series.length - 1) * w).toFixed(1) + ',' +
           (h - 4 - (p[1] - lo) / rg * (h - 8)).toFixed(1); }).join('');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
    'role="img" aria-label="' + T('Andamento del prezzo', 'Price trend') + '"><path d="' + d +
    '" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

/* ------------------------------------------------------------------ pagine */
var REPO = 'https://github.com/mpascale19/conviction-engine';
var PAGES = ['home', 'aziende', 'guida', 'richieste'];

function navBar(cur){
  var items = [['home', T('Home', 'Home')], ['aziende', T('Aziende', 'Companies')],
               ['guida', T('Come funziona', 'How it works')],
               ['richieste', T('Richieste', 'Requests')]];
  return '<nav class="nav">' + items.map(function(p){
    return '<a href="#' + p[0] + '"' + (p[0] === cur ? ' class="on"' : '') + '>' +
      esc(p[1]) + '</a>'; }).join('') + '</nav>';
}

function statTile(n, label, note){
  return '<div class="tile"><b>' + n + '</b><span>' + esc(label) + '</span>' +
    (note ? '<em>' + esc(note) + '</em>' : '') + '</div>';
}

function renderHome(){
  var cs = (IDX.companies || []), buy = cs.filter(function(c){ return c.buyers > 0; });
  var cl = cs.filter(function(c){ return c.cluster; });
  var full = cs.filter(function(c){ return (c.covered_pct || 0) >= 80; });
  var top = cs.slice(0, 3);
  app.innerHTML = navBar('home') + problems(IDX.errors) +
    '<div class="card hero">' +
      '<h1>' + T('Un punteggio di convinzione, costruito a vista',
                 'A conviction score, built in the open') + '</h1>' +
      '<p class="lead">' +
      T('Legge i Form 4 depositati alla SEC, i prezzi, lo short interest e le earnings call di ' +
        cs.length + ' aziende americane, e ne ricava un punteggio da 0 a 100. ' +
        'Il modello linguistico estrae i fatti dai documenti; il punteggio lo calcola una formula ' +
        'scritta a mano, con i pesi in chiaro. Due giri sugli stessi documenti danno lo stesso numero.',
        'It reads the Form 4 filings at the SEC, prices, short interest and earnings calls of ' +
        cs.length + ' US companies, and turns them into a score from 0 to 100. ' +
        'The language model extracts facts from the documents; the score is computed by a formula ' +
        'written by hand, with the weights in plain sight. Two runs on the same documents give the same number.') +
      '</p>' +
      '<div class="tiles">' +
        statTile(cs.length, T('aziende seguite', 'companies followed'),
                 T((IDX.groups || []).length + ' universi', (IDX.groups || []).length + ' universes')) +
        statTile(buy.length, T('con acquisti insider', 'with insider buying'),
                 T('ultimi 90 giorni', 'last 90 days')) +
        statTile(cl.length, T('cluster attivi', 'active clusters'),
                 T('3+ compratori in 30 giorni', '3+ buyers in 30 days')) +
        statTile(full.length, T('con copertura piena', 'with full coverage'),
                 T('call e short interest inclusi', 'calls and short interest included')) +
      '</div>' +
      '<p class="sub">' + T('Aggiornato il ', 'Updated ') + esc(when(IDX.generated_at)) +
      T('. Tre aggiornamenti al giorno nei giorni feriali.',
        '. Three updates a day on weekdays.') + '</p>' +
      '<div class="cta"><a class="btn" href="#aziende">' +
      T('Vedi tutte le aziende', 'See all companies') + '</a>' +
      '<a class="btn ghost" href="#guida">' + T('Come funziona', 'How it works') + '</a></div>' +
    '</div>' +

    '<div class="card"><h2>' + T('I punteggi più alti di oggi', 'Today’s highest scores') +
    '</h2><p class="sub">' +
    T('Un punteggio alto non è un consiglio: è un invito a guardare la scheda.',
      'A high score is not advice: it is an invitation to open the page.') + '</p>' +
    '<div class="scroll"><table><thead><tr><th>' + T('Azienda', 'Company') + '</th>' +
    '<th class="num">' + T('Punteggio', 'Score') + '</th><th class="hide-s">' +
    T('Lettura', 'Reading') + '</th><th class="num">' + T('Copertura', 'Coverage') +
    '</th></tr></thead><tbody>' + top.map(function(c){
      return '<tr data-t="' + esc(c.ticker) + '"><td><span class="tk">' + esc(c.ticker) +
        '</span><div class="nm">' + esc(c.name) + '</div></td>' +
        '<td class="num">' + scoreCell(c.score) + '</td>' +
        '<td class="hide-s">' + esc(txt(c.verdict)) + '</td>' +
        '<td class="num">' + (c.covered_pct || 0) + '%</td></tr>';
    }).join('') + '</tbody></table></div></div>' +

    '<div class="card sub">' + T(
      'Strumento didattico, non una raccomandazione di investimento. Il codice, i dati e la ' +
      'formula sono pubblici: ', 'A teaching tool, not investment advice. The code, the data and ' +
      'the formula are public: ') + '<a href="' + REPO + '" target="_blank" rel="noopener">GitHub</a>.</div>';
  [].forEach.call(app.querySelectorAll('tbody tr'), function(tr){
    tr.addEventListener('click', function(){ location.hash = tr.dataset.t; });
  });
}

function renderGuide(){
  var steps = T([
    ['Si scaricano i documenti',
     'Per ogni azienda: i Form 4 degli ultimi due anni da SEC EDGAR, i prezzi di chiusura, le azioni ' +
     'in circolazione dalla copertina dei 10-Q, e lo short interest pubblicato da FINRA.'],
    ['Il modello estrae, non giudica',
     'Dalle trascrizioni delle earnings call ricava fatti strutturati: il tono, ogni voce di guidance ' +
     'con la sua direzione, quanto sono dirette le risposte agli analisti. Numeri e frasi, non opinioni.'],
    ['Ogni operazione viene classificata',
     'Un acquisto sul mercato pesa. Una vendita programmata da un piano 10b5-1, le azioni trattenute ' +
     'per le imposte, un esercizio di opzioni: non pesano. Restano visibili, ma con peso zero.'],
    ['Si applica la formula',
     'Sette sotto-punteggi, ognuno con un peso fisso. Se una fonte manca, il suo peso si ridistribuisce ' +
     'sugli altri e il sito dichiara quanta parte dei dati aveva a disposizione.'],
    ['Si scrive perché',
     'Ogni sotto-punteggio porta le frasi che lo giustificano, con i numeri dentro. Nessuna riga del ' +
     'sito è un giudizio senza una fonte dietro.']
  ], [
    ['The documents are downloaded',
     'For each company: the Form 4 filings of the last two years from SEC EDGAR, closing prices, shares ' +
     'outstanding from the cover of the 10-Q, and the short interest published by FINRA.'],
    ['The model extracts, it does not judge',
     'From the earnings-call transcripts it draws structured facts: the tone, every guidance item with ' +
     'its direction, how direct the answers to analysts are. Numbers and phrases, not opinions.'],
    ['Every transaction is classified',
     'An open-market purchase counts. A sale scheduled under a 10b5-1 plan, shares withheld for taxes, ' +
     'an option exercise: they do not. They stay visible, at zero weight.'],
    ['The formula is applied',
     'Seven sub-scores, each with a fixed weight. If a source is missing, its weight is redistributed ' +
     'over the others and the site states how much of the data it actually had.'],
    ['The reasons are written down',
     'Every sub-score carries the sentences that justify it, numbers included. No line on this site is ' +
     'a verdict without a source behind it.']
  ]);
  var subs = T([

/* etichette dei trimestri: nelle estrazioni sono scritte all'italiana */
function qLabel(q){
  q = String(q || '');
  if (LANG === 'en') q = q.replace(/^T(\d)/, 'Q$1').replace('(anno fiscale)', '(fiscal year)');
  return q;
}
function qShort(q){ return qLabel(q).replace(/\s*\(.*\)\s*/, ''); }

var DIRS = {
  alzata:     ['alzata', 'raised', 'good'],
  ridotta:    ['ridotta', 'lowered', 'warn'],
  confermata: ['confermata', 'confirmed', ''],
  prima:      ['data per la prima volta', 'first given', 'info']
};
function dirChip(d){
  var x = DIRS[d];
  if (!x) return '';
  return '<span class="chip ' + x[2] + '">' + esc(LANG === 'en' ? x[1] : x[0]) + '</span>';

function dots(n){
  var out = '';
  for (var i = 1; i <= 5; i++) out += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
  return '<span class="dots" title="' + T('direttezza ', 'directness ') + n + '/5">' + out + '</span>';
}

/* grafico a linea: coppie [data, valore]. Scala in modo uniforme, niente testo stirato. */
function lineChart(pts, fmt, label){
  if (!pts || pts.length < 2) return '';
  var W = 600, H = 170, L = 56, R = 12, TT = 14, B = 26;
  var vs = pts.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), rg = (hi - lo) || 1;
  var x = function(i){ return L + i / (pts.length - 1) * (W - L - R); };
  var y = function(v){ return TT + (1 - (v - lo) / rg) * (H - TT - B); };
  var line = pts.map(function(p, i){
    return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join('');
  var area = line + 'L' + x(pts.length - 1).toFixed(1) + ',' + (H - B) +
             'L' + L + ',' + (H - B) + 'Z';
  var last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    esc(label || '') + '">' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) +
      '" stroke="var(--axis)" stroke-width="1"/>' +
    '<path d="' + area + '" fill="var(--blue)" opacity=".09"/>' +
    '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2"/>' +
    '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(last[1]).toFixed(1) +
      '" r="3.5" fill="var(--blue)"/>' +
    '<text x="' + (L - 8) + '" y="' + (y(hi) + 4).toFixed(1) + '" text-anchor="end">' + fmt(hi) + '</text>' +
    '<text x="' + (L - 8) + '" y="' + (y(lo) + 4).toFixed(1) + '" text-anchor="end">' + fmt(lo) + '</text>' +
    '<text x="' + L + '" y="' + (H - 8) + '">' + esc(day(pts[0][0])) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(day(last[0])) + '</text>' +
    '</svg>';
}

      'How many days of trading it would take the shorts to get out.') + '</p>' +
    lineChart(dtc, function(v){ return nu(v.toFixed(1)); },
              T('Giorni per ricoprire', 'Days to cover')) + '</div>';
}

function paneCalls(d){
  var calls = d.calls || [], last = calls[calls.length - 1] || {};
  var chg = [];
  calls.slice().reverse().forEach(function(c){
    (c.language_changes || []).forEach(function(x){ chg.push([c.quarter, x]); });
  });
  return '<div class="card"><h2>' + T('Tono delle call', 'Tone of the calls') + '</h2><p class="sub">' +
    T('Da 0 a 100, estratto dal linguaggio del management. Non è il prezzo: è come parlano.',
      'From 0 to 100, extracted from how management speaks. Not the price: the words.') + '</p>' +
    toneBars(calls) +
    (last.tone_why ? '<p class="sub" style="margin-top:14px"><b>' + esc(qLabel(last.quarter)) +
      '</b> — ' + esc(txt(last.tone_why)) + '</p>' : '') + '</div>' +

    '<div class="card"><h2>' + T('Guidance dell’ultima call', 'Guidance in the latest call') +
    '</h2><p class="sub">' + esc(qLabel(last.quarter)) +
    (last.call_date ? ' · ' + esc(day(last.call_date)) : '') + '</p>' +
    '<div class="scroll"><table><thead><tr><th>' + T('Voce', 'Item') + '</th>' +
    '<th>' + T('Valore', 'Value') + '</th><th>' + T('Direzione', 'Direction') + '</th></tr></thead><tbody>' +
    (last.guidance || []).map(function(g){
      return '<tr style="cursor:default"><td>' + esc(txt(g.metric)) + '</td>' +
        '<td class="nm">' + esc(txt(g.value)) + '</td><td>' + dirChip(g.direction) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>' +

    (chg.length ? '<div class="card"><h2>' + T('Che cosa è cambiato nelle parole',
      'What changed in the words') + '</h2><p class="sub">' +
      T('Le promesse confrontate con quelle dei trimestri precedenti.',
        'Promises set against those of the previous quarters.') + '</p>' +
      chg.map(function(r){
        var x = r[1];
        return '<div class="chg"><b>' + esc(txt(x.topic)) + '</b> <span class="nm">' +
          esc(qShort(r[0])) + '</span>' +
          '<div class="ft"><i>' + T('prima:', 'before:') + '</i> ' + esc(txt(x.from)) + '<br>' +
          '<i>' + T('poi:', 'after:') + '</i> ' + esc(txt(x.to)) + '</div>' +
          (x.note ? '<div class="nt">' + esc(txt(x.note)) + '</div>' : '') + '</div>';
      }).join('') + '</div>' : '') +

    ((last.qa || []).length ? '<div class="card"><h2>' +
      T('Domande e risposte', 'Questions and answers') + '</h2><p class="sub">' +
      T('I pallini misurano quanto la risposta è diretta, da 1 a 5.',
        'The dots measure how direct the answer is, from 1 to 5.') + '</p>' +
      (last.qa || []).map(function(q){
        return '<div class="qa"><div class="q">' + esc(txt(q.question)) + dots(q.directness) + '</div>' +
          '<div class="a">' + esc(txt(q.answer_summary)) + '</div></div>';
      }).join('') + '</div>' : '');
}

function renderDetail(d){
  var s = d.score || {}, co = d.company || {}, last = (d.price || {}).last;
  var tabs = [['panoramica', T('Panoramica', 'Overview')], ['insider', T('Insider', 'Insiders')]];
  if ((d.si_series || []).length) tabs.push(['mercato', T('Mercato', 'Market')]);
  if ((d.calls || []).length) tabs.push(['call', T('Call', 'Calls')]);
  if (!tabs.some(function(t){ return t[0] === TAB; })) TAB = 'panoramica';
  var pane = TAB === 'insider' ? paneInsider(d)
           : TAB === 'mercato' ? paneMarket(d)
           : TAB === 'call' ? paneCalls(d) : paneOverview(d);

  app.innerHTML = problems(d.errors) +
    '<div class="card"><button class="back" id="bk">← ' +
      T('Tutte le aziende', 'All companies') + '</button>' +
      '<div class="top" style="margin-top:12px"><div>' +
        '<h1>' + esc(co.name || co.ticker) + ' <span class="nm">' + esc(co.ticker) + '</span></h1>' +
        '<p class="sub">' + (last
          ? T('Ultima chiusura ', 'Last close ') + esc(day(last.d)) + ': $' + n2(last.c)
          : T('Prezzo non disponibile', 'Price not available')) +
        (d.price_source ? T(' · fonte ', ' · source ') + esc(d.price_source) : '') +
        ' · CIK ' + esc(co.cik || '—') + (d.group ? ' · ' + esc(txt(d.group)) : '') + '</p></div></div>' +
      '<div class="big" style="color:' + tone(s.value) + '">' + (s.value == null ? '—' : s.value) +
        '<span class="sub" style="font-size:17px"> / 100</span></div>' +
      '<div><b>' + esc(txt(s.verdict)) + '</b>' +
        (s.confidence ? T(' · confidenza ', ' · confidence ') + esc(wd(s.confidence)) : '') +
        (s.covered_pct != null ? T(' · copertura dei dati ', ' · data coverage ') + s.covered_pct + '%' : '') +
        '</div>' + spark((d.price || {}).series) +
      '<div class="tabs" role="tablist">' + tabs.map(function(t){
        return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' +
          (t[0] === TAB) + '">' + esc(t[1]) + '</button>'; }).join('') + '</div></div>' +
    pane;

  document.getElementById('bk').addEventListener('click', function(){ location.hash = 'aziende'; });
  [].forEach.call(app.querySelectorAll('.tabs button'), function(b){
    b.addEventListener('click', function(){ TAB = b.dataset.tab; renderDetail(d); });
  });
}

/* ------------------------------------------------------------------ rotta */
function show(){
  var raw = (location.hash || '').replace('#', '');
  if (!IDX) return;
  var p = raw.toLowerCase();
  if (!raw || p === 'home') return renderHome();
  if (p === 'aziende') return renderList();
  if (p === 'guida') return renderGuide();
  if (p === 'richieste') return renderRequests();
  var t = raw.toUpperCase();
  if (t !== CUR) { CUR = t; TAB = 'panoramica'; }
  if (CACHE[t]) return renderDetail(CACHE[t]);
  app.innerHTML = '<div class="card">' + T('Carico ', 'Loading ') + esc(t) + '…</div>';
  fetch('data/' + encodeURIComponent(t) + '.json?' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){ CACHE[t] = d; renderDetail(d); })
    .catch(function(e){
      app.innerHTML = '<div class="card">' +
        T('Non trovo i dati di <b>' + esc(t) + '</b>.', 'No data found for <b>' + esc(t) + '</b>.') +
        '<div class="sub">' + esc(e) + '</div><div style="margin-top:12px">' +
        '<button id="bk2">' + T('Torna all’elenco', 'Back to the list') + '</button></div></div>';
      document.getElementById('bk2').addEventListener('click', function(){ location.hash = 'aziende'; });
    });
}

function load(force){
  if (!force && IDX) return show();
  app.innerHTML = '<div class="card">' + T('Carico i dati…', 'Loading the data…') + '</div>';
  fetch('index.json?' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ IDX = j; show(); })
    .catch(function(e){
      app.innerHTML = '<div class="card"><b>' + T('Nessun index.json', 'No index.json yet') +
        '</b><div class="sub" style="margin-top:6px">' + esc(e) +
        '</div><div style="margin-top:10px;font-size:13.5px">' +
        T('Fai girare <code>python -m pipeline.build</code>, oppure il workflow ' +
            '<b>Aggiorna i dati</b> dalla scheda Actions.',
          'Run <code>python -m pipeline.build</code>, or the <b>Aggiorna i dati</b> ' +
            'workflow from the Actions tab.') + '</div></div>';
    });
}

document.getElementById('lang').addEventListener('click', function(ev){
  var b = ev.target.closest('button');
  if (!b || b.dataset.l === LANG) return;
  setLang(b.dataset.l);
  if (IDX) show();
});
setLang(readLang());
window.addEventListener('hashchange', show);
load();
</script>
