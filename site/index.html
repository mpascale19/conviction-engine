<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conviction Engine</title>
<style>
  :root{color-scheme:light dark;--bg:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#86857e;
        --line:#e1e0d9;--blue:#2a78d6;--warnbg:#fdf2e3;--warnink:#8a5a12}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
        --ink3:#8e8d85;--line:#2c2c2a;--blue:#3987e5;--warnbg:#3a2a12;--warnink:#f0c478}}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 48px;background:var(--bg);color:var(--ink);
       font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:720px;margin:auto;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .score{font-size:64px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:8px 0 2px}
  .muted{color:var(--ink2);font-size:13px}
  .warn{background:var(--warnbg);color:var(--warnink);border:0}
  .warn b{color:inherit}
  .warn ul{margin:8px 0 0;padding-left:18px}
  .warn li{margin:4px 0;font-size:13.5px;word-break:break-word}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--blue)}
  .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:8px;padding:8px 14px;font:600 13.5px inherit;cursor:pointer}
  button:hover{border-color:var(--ink3)}
  button[disabled]{opacity:.5;cursor:default}
  code{background:var(--line);padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>
<div class="wrap" id="app"><div class="card">Carico i dati…</div></div>
<script>
var app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function n2(v){ return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2) : '—'; }
function euro(v){ return (typeof v === 'number' && isFinite(v))
  ? '$' + Math.round(v).toLocaleString('it-IT') : '—'; }

function problems(d){
  var list = (d.errors || []).slice();
  if (!list.length) return '';
  return '<div class="card warn"><b>La raccolta dei dati ha avuto problemi</b>' +
    '<ul>' + list.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' +
    '<div style="margin-top:10px;font-size:13px">Il resto della pagina mostra quello che è arrivato lo stesso.</div></div>';
}

function render(d){
  var s = d.score || {}, co = d.company || {}, last = (d.price || {}).last || null;
  var subs = s.subs || [], tx = d.tx || [], c = d.counts || {};
  var when = String(d.generated_at || '').replace('T', ' alle ').replace('+00:00', ' UTC');

  var head = '<div class="card"><div class="top"><div>' +
    '<h1>' + esc(co.name || co.ticker || 'Titolo') +
      (co.ticker ? ' (' + esc(co.ticker) + ')' : '') + '</h1>' +
    '<div class="muted">' +
      (last ? 'Ultima chiusura ' + esc(last.d) + ': $' + n2(last.c)
            : 'Prezzo non disponibile') +
      (d.price_source ? ' · fonte ' + esc(d.price_source) : '') +
      (when ? ' · dati del ' + esc(when) : '') +
    '</div></div>' +
    '<button id="rl">Ricarica i dati</button></div>' +
    (typeof s.value === 'number'
      ? '<div class="score">' + s.value + '<span class="muted" style="font-size:18px"> / 100</span></div>' +
        '<div><b>' + esc(s.verdict || '') + '</b>' +
        (s.confidence ? ' · confidenza ' + esc(String(s.confidence).toLowerCase()) : '') +
        (typeof s.covered_pct === 'number' ? ' · copertura dei dati ' + s.covered_pct + '%' : '') + '</div>'
      : '<div class="muted" style="margin-top:8px">Punteggio non calcolabile: mancano i dati di partenza.</div>') +
    '</div>';

  var table = subs.length
    ? '<div class="card"><h1>Sotto-punteggi</h1><table><tr><th>Voce</th><th class="num">Peso</th><th>Valore</th></tr>' +
      subs.map(function(x){
        var why = (x.why || [])[0] || '';
        return '<tr><td>' + esc(x.name) + '<br><span class="muted">' + esc(why) + '</span></td>' +
          '<td class="num">' + esc(x.w) + '%</td><td>' +
          (typeof x.v === 'number'
            ? '<b>' + x.v + '</b><div class="bar"><i style="width:' + Math.max(0, Math.min(100, x.v)) + '%"></i></div>'
            : '<span class="muted">non disponibile</span>') + '</td></tr>';
      }).join('') + '</table></div>'
    : '';

  var ops = '<div class="card"><h1>Ultime operazioni degli insider</h1>' + (tx.length
    ? '<table><tr><th>Data</th><th>Insider</th><th>Tipo</th><th class="num">Valore</th></tr>' +
      tx.slice(-12).reverse().map(function(t){
        return '<tr><td class="num">' + esc(t.date) + '</td>' +
          '<td>' + esc(t.who) + '<br><span class="muted">' + esc(t.role) + '</span></td>' +
          '<td>' + esc(t.kind) + '<br><span class="muted">' + esc(t.read) + '</span></td>' +
          '<td class="num">' + euro(t.value) + '</td></tr>';
      }).join('') + '</table>'
    : '<div class="muted">Nessuna operazione trovata. Se qui sopra c’è un errore su EDGAR, è quello il motivo; ' +
      'altrimenti vuol dire che in questo periodo non ne sono state depositate.</div>') + '</div>';

  var foot = '<div class="card muted">' +
    (d.sources || []).map(function(x){ return esc(x.t) + ' (' + esc(x.m) + ')'; }).join(' · ') +
    (c.prices ? '<br>' + c.prices + ' sedute di prezzo, ' + (c.tx || 0) + ' operazioni lette.' : '') +
    '<br>Strumento didattico, non è una raccomandazione di investimento.</div>';

  app.innerHTML = problems(d) + head + table + ops + foot;
  var b = document.getElementById('rl');
  if (b) b.addEventListener('click', function(){ b.disabled = true; b.textContent = 'Carico…'; load(); });
}

function fail(title, detail, hint){
  app.innerHTML = '<div class="card"><b>' + esc(title) + '</b>' +
    '<div class="muted" style="margin-top:6px">' + esc(detail) + '</div>' +
    (hint ? '<div style="margin-top:10px;font-size:13.5px">' + hint + '</div>' : '') +
    '<div style="margin-top:14px"><button onclick="load()">Riprova</button></div></div>';
}

function load(){
  fetch('data.json?' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){
      try { render(d); }
      catch (e) { fail('I dati sono arrivati ma non riesco a mostrarli', String(e),
        'Mandami questo messaggio e il file <code>data.json</code>.'); }
    })
    .catch(function(e){
      fail('Nessun data.json', String(e),
        'Fai girare <code>python -m pipeline.build</code> in locale, oppure il workflow ' +
        '<b>Aggiorna i dati</b> dalla scheda Actions.');
    });
}
load();
</script>
