<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conviction Engine</title>
<link rel="alternate" type="application/rss+xml" title="Conviction Engine: acquisti degli insider" href="feed.xml">
<link rel="alternate" type="application/rss+xml" title="Conviction Engine: insider buying" href="feed-en.xml" hreflang="en">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:wght@500;600&display=swap">
<style>
  :root{color-scheme:light dark;
    --bg:#e8ecf1;--card:#fff;--sunken:#f1f4f8;--ink:#10131a;--ink2:#4d5664;--ink3:#7d8694;
    --line:#dfe3e8;--axis:#c6ccd4;--blue:#1f6bb8;--bull:#1f6bb8;--bear:#b23b2e;--mid:#7d8694;
    --bull1:#6da7ec;--bull2:#2a78d6;--bull3:#1c5cab;
    --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;
    --lift:0 1px 2px rgba(16,19,26,.05),0 1px 1px rgba(16,19,26,.04);
    --bear1:#ef8d84;--bear2:#d04a3c;--bear3:#a32e23;
    --good:#19714a;--goodbg:#e4f1ea;--warnbg:#fbf0dd;--warnink:#7d540f;--infobg:#e7eff8}
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0e13;--card:#161a21;--sunken:#1e232b;--ink:#edf0f4;--ink2:#b3bcc8;--ink3:#8a94a2;
    --line:#272d36;--axis:#39414c;--blue:#5fa3ea;--bull:#5fa3ea;--bear:#e8766a;--mid:#8a94a2;
    --bull1:#3987e5;--bull2:#5fa3ea;--bull3:#9ec5f4;
    --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;
    --lift:0 1px 2px rgba(0,0,0,.35);
    --bear1:#c0564a;--bear2:#e8766a;--bear3:#f4a79f;
    --good:#56c08a;--goodbg:#10291d;--warnbg:#332512;--warnink:#edc073;--infobg:#121f2e}}
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{margin:0;padding:24px 16px 56px;background:var(--bg);color:var(--ink);
       font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  /* i titoli portano la voce del progetto, il resto resta neutro e leggibile */
  h1,h2,.serif{font-family:Spectral,Georgia,"Times New Roman",serif;font-weight:600}
  /* I link dentro al testo non prendono un colore: su questo sito il colore dice
     solo se un numero è sopra o sotto la metà, e un link non è né l'uno né l'altro.
     A segnalarlo basta la sottolineatura. (.nav a resta com'era: vince per specificità) */
  a{color:inherit;text-decoration:underline;text-decoration-color:var(--ink3);
    text-underline-offset:2px;text-decoration-thickness:1px}
  a:hover{text-decoration-color:var(--ink)}
  .wrap{max-width:940px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;
        min-width:0;box-shadow:var(--lift)}
  h1{font-size:23px;margin:0;letter-spacing:-.005em;line-height:1.25}
  h2{font-size:17px;margin:0 0 3px;letter-spacing:-.005em}
  .sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  button{appearance:none;border:1px solid var(--axis);background:var(--card);color:var(--ink);
         border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  button:hover{border-color:var(--ink3)}
  button[disabled]{opacity:.5;cursor:default}
  .langbar{display:flex;justify-content:flex-end;margin:-6px 0 -6px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
  .lang button{border:0;border-radius:0;background:transparent;color:var(--ink2);
               padding:5px 13px;font-family:inherit;font-size:12px;font-weight:650;line-height:1.4;letter-spacing:.04em}
  .lang button+button{border-left:1px solid var(--line)}
  .lang button[aria-pressed="true"]{background:var(--sunken);color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:440px}
  th{font-size:12.5px;color:var(--ink2);text-align:left;padding:0 8px 9px;font-weight:600}
  .picks{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
  .pick{flex:1 1 240px;min-width:0;padding:9px 12px;border-radius:8px;
        border:1px solid var(--line);background:var(--card);color:var(--ink);
        font-family:inherit;font-size:14px}
  .pick:focus{border-color:var(--blue);outline:none}
  .vs{color:var(--ink3);font-size:13px;flex:none}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cmp-head{background:var(--sunken);border:1px solid var(--line);border-radius:10px;
            padding:16px;min-width:0}
  .meter.m-cmp{width:100%;max-width:120px}
  .cmp-head .meter.m-cmp{max-width:none}
  @media (max-width:620px){.cmp{grid-template-columns:1fr}}
  .find{margin-top:12px;width:100%;max-width:320px;padding:9px 12px;border-radius:8px;
        border:1px solid var(--line);background:var(--card);color:var(--ink);
        font-family:inherit;font-size:14px}
  .find:focus{border-color:var(--blue);outline:none}
  th.so{cursor:pointer;user-select:none;white-space:nowrap}
  th.so:hover{color:var(--ink)}
  th.so.on{color:var(--ink)}
  th.so i{font-style:normal;display:inline-block;width:11px;color:var(--blue)}
  td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--sunken)}
  .tk{font-weight:650}
  .nm{color:var(--ink2);font-size:12.5px}
  .sc{display:inline-flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
  .sc b{font-size:16px;font-weight:650;min-width:22px;text-align:right}
  /* Ogni punteggio è uno scarto da 50: la barra parte dal centro, non da sinistra. */
  .meter{position:relative;height:7px;border-radius:4px;background:var(--line);
         flex:none;display:inline-block;vertical-align:middle}
  .meter::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;
                 width:1px;background:var(--axis)}
  .meter i{position:absolute;top:0;bottom:0;border-radius:4px}
  /* La fascia che il punteggio occupa quando si cambiano i pesi. Sta sotto la
     barra e non sopra: sovrapposta la coprirebbe, e il punto resta il
     punteggio. Stessa scala orizzontale, quindi si legge in verticale. */
  .meter u{position:absolute;top:calc(100% + 5px);height:3px;border-radius:2px;
           background:var(--ink3);opacity:.5}
  .meter.lg{height:11px;border-radius:6px}
  /* i cento punti della formula, divisi per voce */
  .mix{display:flex;gap:2px;margin:14px 0 4px;height:30px}
  .mix span{display:flex;align-items:center;justify-content:center;border-radius:4px;
            font-size:12px;font-weight:600;color:#10131a;min-width:0;overflow:hidden}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;
          margin-right:8px;vertical-align:-1px;flex:none}
  .hist{margin:18px 0 2px}
  .hist-plot{display:flex;align-items:flex-end;gap:2px;height:168px;
             border-bottom:1px solid var(--axis)}
  .hb{flex:1;min-width:0;display:flex;align-items:flex-end;height:100%;position:relative}
  .hb i{display:block;width:100%;height:var(--h);border-radius:4px 4px 0 0;min-height:1px}
  .hb.zero{border-left:1px solid var(--ink3)}
  .hb b{position:absolute;left:0;right:0;bottom:calc(var(--h) + 5px);text-align:center;
        font-size:11px;font-weight:600;color:var(--ink2)}
  .hist-axis{display:flex;justify-content:space-between;margin-top:7px;
             font-size:12px;color:var(--ink3)}
  .meter.m-row{width:84px}
  @media (max-width:620px){.meter.m-row{width:38px}}
  /* la barra del rendimento: stessa geometria, ancorata allo zero */
  .meter.m-ret{width:96px}
  @media (max-width:620px){.meter.m-ret{width:54px}}
  /* la correlazione di rango parte da zero: niente linea di mezzeria */
  .meter.m-lin{width:96px}
  .meter.m-lin::before{display:none}
  @media (max-width:620px){.meter.m-lin{width:54px}}
  .sc.ret b{min-width:52px;font-size:14.5px}
  /* due sole colonne: non serve la larghezza minima delle tabelle larghe */
  table.t-narrow{min-width:0}
  /* inline-block: ::first-letter non si applica alle scatole in linea */
  .capf{display:inline-block}
  .capf::first-letter{text-transform:uppercase}
  .sc b{font-size:16px;font-weight:650;min-width:26px;display:inline-block;text-align:right}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;
        font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink2);white-space:nowrap}
  .chip.good{background:var(--goodbg);color:var(--good)}
  .chip.info{background:var(--infobg);color:var(--blue)}
  .chip.warn{background:var(--warnbg);color:var(--warnink)}
  .warn-card{background:var(--warnbg);color:var(--warnink);border:0}
  .warn-card ul{margin:8px 0 0;padding-left:18px}
  .warn-card li{font-size:13px;margin:3px 0;word-break:break-word}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px;width:100%}
  .bar i{display:block;height:100%}
  .big{font-size:56px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:6px 0 2px}
  .subs li{list-style:none;display:grid;grid-template-columns:150px 54px minmax(0,1fr);
           gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
  .subs{margin:0;padding:0}
  .subs li:first-child{border-top:0}
  .subs .w{color:var(--ink2);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .subs p{margin:0;font-size:13px;color:var(--ink2)}
  .subs b{font-size:13.5px}
  .scroll{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
  .back{margin-bottom:2px}
  .gf{padding:6px 12px;font-size:12.5px}
  /* la curva "dopo un acquisto" */
  .evr{margin:12px 0 0;font-size:14.5px;max-width:70ch}
  .evp{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .evp .gf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .evl{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--ink2)}
  .evl i,.evtip i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
  .evsw{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .evw{position:relative;margin-top:10px;min-width:0}
  .evw svg{display:block;max-width:100%;touch-action:pan-y}
  .evw svg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .evax{font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
  .evend{font-size:12px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
  .evtip{position:absolute;z-index:2;pointer-events:none;background:var(--card);border:1px solid var(--line);
         border-radius:8px;box-shadow:var(--lift);padding:8px 10px;font-size:12.5px;max-width:min(330px,80%);line-height:1.45}
  .evtip .evth{font-weight:600;margin-bottom:3px}
  .evd{margin-top:14px}
  .evd summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .evd[open] summary{margin-bottom:8px}
  .spark{width:100%;height:56px;display:block}
  /* il termometro degli insider e gli avvisi */
  .evl i.thdash{height:0;border-top:1.5px dashed var(--ink3);background:none;border-radius:0}
  .evl i.thlow{height:0;border-top:2px dotted var(--c1);background:none;border-radius:0}
  .thh{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
  .thn b{display:block;font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .thn span{display:block;font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.4}
  .thw{min-width:0}
  .thw p{margin:0 0 10px;font-size:14px;line-height:1.55;max-width:70ch}
  .thsp{width:100%;height:64px;display:block}
  .thspx{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink3);margin-top:3px}
  .thh3{font-size:15px;margin:22px 0 4px}
  .feed{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px}
  .feed code{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
             font-size:13px;overflow-wrap:anywhere;min-width:0;flex:1 1 260px;user-select:all}
  @media (max-width:620px){ .thh{grid-template-columns:1fr;gap:10px} }
  /* il radar */
  .rdt tr[data-rk]{cursor:pointer}
  .rdt tr[aria-expanded="true"] td{border-bottom-color:transparent}
  .rdx td{background:var(--sunken)}
  .rdd{padding:2px 0 6px}
  .rdd table td{background:transparent}
  @media (max-width:620px){
    .hide-s{display:none}
    .subs li{grid-template-columns:minmax(0,1fr) 54px}
    .subs p{grid-column:1/-1}
  }
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--ink2);
               padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:600;
               border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
  .tabs button:hover{color:var(--ink);border-color:transparent}
  .tabs button[aria-selected="true"]:hover{border-bottom-color:var(--blue)}
  .chart{width:100%;height:auto;display:block;margin-top:6px}
  .chart text{font:11px Inter,system-ui,sans-serif;fill:var(--ink3)}
  .bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;margin-top:12px}
  .bars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
  .bars i{display:block;border-radius:3px 3px 0 0}
  .bars b{font-size:12px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
  .bars span{font-size:10.5px;color:var(--ink3);text-align:center;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .chg{border-left:2px solid var(--axis);padding:2px 0 2px 12px;margin:14px 0}
  .chg .ft{font-size:13px;color:var(--ink2);margin-top:4px}
  .chg .ft i{font-style:normal;color:var(--ink3)}
  .chg .nt{font-size:12.5px;color:var(--ink2);margin-top:5px}
  .qa{border-top:1px solid var(--line);padding:11px 0}
  .qa:first-of-type{border-top:0}
  .qa .q{font-size:13.5px;font-weight:600}
  .qa .a{font-size:13px;color:var(--ink2);margin-top:3px}
  .dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:7px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--blue)}
  .nav{display:flex;gap:2px;flex-wrap:wrap;margin:0 0 2px}
  .nav a{padding:8px 15px;border-radius:99px;font-family:inherit;font-size:13.5px;font-weight:600;
         color:var(--ink2);text-decoration:none}
  .nav a:hover{background:var(--sunken);color:var(--ink)}
  .nav a.on{background:var(--ink);color:var(--bg)}
  .hero h1{font-size:28px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.2}
  .lead{font-size:15.5px;line-height:1.6;color:var(--ink2);margin:0 0 4px;max-width:64ch}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:20px 0 14px}
  .tile{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:15px 16px}
  /* provenienza: ogni dato con la sua etichetta, invece di una catena di puntini */
  .facts{display:flex;flex-wrap:wrap;gap:4px 20px;margin:8px 0 0;font-size:13px;color:var(--ink2)}
  .facts span{display:inline-flex;gap:6px;white-space:nowrap}
  .facts em{font-style:normal;color:var(--ink3)}
  .tile b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1;
          font-variant-numeric:tabular-nums}
  .tile span{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
  .tile em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:2px}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{display:inline-block;background:var(--ink);color:var(--bg);border:1px solid var(--ink);
       border-radius:8px;padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:600;
       text-decoration:none;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--axis)}
  .btn:hover{opacity:.87}
  .steps{counter-reset:s;list-style:none;margin:0;padding:0}
  .steps li{counter-increment:s;position:relative;padding:14px 0 14px 46px;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0}
  .steps li::before{content:counter(s);position:absolute;left:0;top:15px;width:28px;height:28px;
    border-radius:50%;background:var(--sunken);color:var(--ink2);font-size:13px;font-weight:650;
    display:grid;place-items:center}
  .steps b{font-size:14.5px}
  .steps p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.55}
  .faq{border-top:1px solid var(--line)}
  .faq:first-of-type{border-top:0}
  .faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:14px;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:'+';display:inline-block;width:18px;color:var(--ink3);font-weight:400}
  .faq[open] summary::before{content:'\2013'}
  .faq p{margin:0 0 14px 18px;font-size:13.5px;color:var(--ink2);line-height:1.55}
  .field{margin:14px 0}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
  .field input,.field textarea{width:100%;background:var(--card);color:var(--ink);
    font-family:inherit;font-size:14px;line-height:1.5;
    border:1px solid var(--axis);border-radius:8px;padding:10px 12px;resize:vertical}
  .field input{text-transform:uppercase}
  .field input::placeholder,.field textarea::placeholder{text-transform:none;color:var(--ink3)}
  .field input:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;
    border-color:var(--blue)}
  ul.plain{margin:10px 0 0;padding-left:18px}
  ul.plain li{font-size:13.5px;color:var(--ink2);margin:7px 0;line-height:1.5}
  @media (max-width:620px){.hero h1{font-size:23px}.tile b{font-size:25px}}
  .memo .lead{font-size:16px;color:var(--ink);margin:16px 0 4px}
  .mo{border-top:1px solid var(--line);padding:14px 0 2px;margin-top:10px}
  .mo h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);
         margin:0 0 7px;font-weight:600}
  .mo p{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink)}
  .mo ul.plain{margin:0;padding-left:18px}
  .mo ul.plain li{font-size:14px;color:var(--ink);margin:6px 0}
  sup.src{display:inline-block;background:var(--sunken);color:var(--ink2);border-radius:4px;
          padding:1px 5px;font-size:10.5px;font-weight:650;line-height:1.5;margin-left:3px;
          cursor:pointer;vertical-align:super;text-transform:none}
  sup.src:hover{background:var(--infobg);color:var(--blue)}
</style>
<div class="wrap">
  <div class="langbar"><div class="lang" id="lang" role="group" aria-label="Lingua / Language">
    <button type="button" data-l="it" aria-pressed="false">IT</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div></div>
  <div id="app"><div class="card">…</div></div>
</div>
<script>
/* ------------------------------------------------------------------ lingua */
var LANGS = ['it', 'en'], LOCS = { it: 'it-IT', en: 'en-GB' }, LANG, LI, LOC;
function readLang(){
  var v = null;
  var q = /[?&]lang=(it|en)\b/.exec(location.search || '');   // i link del feed in inglese
  if (q) return q[1];
  try { v = localStorage.getItem('ce-lang'); } catch (e) {}
  if (LANGS.indexOf(v) < 0) v = /^it\b/i.test(navigator.language || '') ? 'it' : 'en';
  return v;
}
function setLang(v){
  LANG = LANGS.indexOf(v) < 0 ? 'en' : v;
  LI = LANGS.indexOf(LANG);
  LOC = LOCS[LANG];
  document.documentElement.lang = LANG;
  try { localStorage.setItem('ce-lang', LANG); } catch (e) {}
  [].forEach.call(document.querySelectorAll('#lang button'), function(b){
    b.setAttribute('aria-pressed', String(b.dataset.l === LANG));
  });
}
/* T('italiano','english') sceglie la stringa della lingua attiva */
function T(){ return arguments[LI] !== undefined ? arguments[LI] : arguments[0]; }
/* txt() accetta sia una stringa semplice sia {it:…, en:…} prodotto dalla pipeline */
function txt(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[LANG] || v.it || v.en || '';
}
function key(v){ return typeof v === 'string' ? v : (v && v.it) || ''; }
var WORDS = {
  Alta: 'high', Media: 'medium', Bassa: 'low', Assente: 'none',
  alta: 'high', media: 'medium', bassa: 'low', assente: 'none'
};
function wd(s){ s = String(s || ''); return LANG === 'it' ? s.toLowerCase() : (WORDS[s] || s.toLowerCase()); }

/* ------------------------------------------------------------------ formato */
var app = document.getElementById('app'), IDX = null, CACHE = {}, GRP = '', CUR = '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function n2(v){ return (typeof v === 'number' && isFinite(v)) ? nu(v.toFixed(2)) : '—'; }
function nu(s){ return LANG === 'it' ? String(s) : String(s).replace(',', '.'); }
function sg(v, d){ return (typeof v === 'number' && isFinite(v))
  ? (v > 0 ? '+' : v < 0 ? '−' : '') + nu(Math.abs(v).toFixed(d === undefined ? 2 : d)) : '—'; }
function money(v){ return (typeof v === 'number' && isFinite(v))
  ? '$' + Math.round(v).toLocaleString(LOC) : '—'; }
function when(s){
  var d = new Date(String(s || ''));
  if (isNaN(d.getTime())) return String(s || '');
  var day = d.toLocaleDateString(LOC, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
  var hm = d.toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });
  return day + T(' alle ', ' at ') + hm + ' UTC';
}
function day(s){
  var d = new Date(String(s || '') + 'T00:00:00Z');
  if (isNaN(d.getTime())) return String(s || '');
  return d.toLocaleDateString(LOC, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function tone(v){
  if (v == null) return 'var(--mid)';
  if (v > 80) return 'var(--bull3)';     // convinzione rialzista forte
  if (v >= 65) return 'var(--bull2)';    // moderata
  if (v >= 55) return 'var(--bull1)';    // leggermente rialzista
  if (v > 45) return 'var(--mid)';       // nessuna convinzione chiara
  if (v >= 35) return 'var(--bear1)';    // leggermente ribassista
  if (v >= 20) return 'var(--bear2)';    // moderata
  return 'var(--bear3)';                 // forte
}
function meterBar(v, w, cls, band){
  var box = '<span class="meter' + (cls ? ' ' + cls : '') + '"' +
            (w ? ' style="width:' + w + 'px"' : '');
  if (v == null) return box + '></span>';
  var half = Math.min(50, Math.abs(v - 50)) / 50 * 50;      // metà della barra
  var side = v >= 50 ? 'left:50%' : 'right:50%';
  // la barra va da 0 a 100 su tutta la larghezza, quindi un punteggio sta
  // alla sua stessa percentuale: la fascia si disegna da lo% a hi%
  var range = '';
  if (band && band.lo != null && band.hi != null && band.hi > band.lo) {
    var lo = Math.max(0, Math.min(100, band.lo));
    var hi = Math.max(0, Math.min(100, band.hi));
    range = '<u style="left:' + lo + '%;width:' + (hi - lo) + '%"></u>';
  }
  return box + ' aria-hidden="true">' + range + '<i style="' + side + ';width:' +
         half.toFixed(1) + '%;background:' + tone(v) + '"></i></span>';
}
/* La barra del rendimento è ancorata allo zero, non a 50, e usa due soli colori:
   sopra lo zero o sotto. La lunghezza dice quanto, dentro la scala dichiarata.
   Non riusa tone(): quella scala è tarata sulle fasce del verdetto, e un
   rendimento non è un verdetto. */
function retBar(v, scale, muted){
  var half = Math.min(1, Math.abs(v) / scale) * 50;
  var col = muted ? 'var(--ink3)' : 'var(--' + (v >= 0 ? 'bull2' : 'bear2') + ')';
  return '<span class="meter m-ret" aria-hidden="true"><i style="' +
    (v >= 0 ? 'left:50%' : 'right:50%') + ';width:' + half.toFixed(1) +
    '%;background:' + col + '"></i></span>';
}
function scoreCell(v){
  return '<span class="sc">' + meterBar(v, 0, 'm-row') +
         '<b>' + (v == null ? '—' : v) + '</b></span>';
}
function problems(list){
  if (!list || !list.length) return '';
  return '<div class="card warn-card"><b>' +
    T('La raccolta dei dati ha avuto problemi', 'Something went wrong while collecting the data') +
    '</b><ul>' + list.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
}
/* Il sito si aggiorna da solo: se il workflow si rompe, nessuno se ne accorge
   e la pagina continua a mostrare numeri vecchi come se fossero di oggi.
   I giri sono alle 06:17, 12:47 e 22:35 UTC dal lunedì al venerdì, quindi il
   buco più lungo normale è il fine settimana (circa 56 ore). Sopra le 60 ore
   non è più un fine settimana: è un guasto, e va detto. */
function dataAge(){
  if (!IDX.generated_at) return null;
  var h = (Date.now() - new Date(IDX.generated_at).getTime()) / 36e5;
  return h >= 0 ? h : null;
}
function staleNote(){
  var h = dataAge();
  if (h === null || h < 14) return '';
  var n = Math.round(h);
  // "controllato" non e' "cambiato": con un giro all'ora la maggior parte dei
  // giri non trova niente di nuovo, ed e' giusto che si veda.
  if (h >= 60) return '<div class="card warn-card"><b>' +
    T('Questi dati hanno ' + n + ' ore', 'This data is ' + n + ' hours old') + '</b><p>' +
    T('L\u2019aggiornamento automatico gira ogni ora nei giorni feriali. Un buco ' +
      'così lungo vuol dire che non sta girando: i numeri qui sotto sono quelli dell\u2019ultimo ' +
      'giro riuscito, non quelli di oggi.',
      'The automatic update runs every hour on weekdays. A gap this long means it is not ' +
      'running: the numbers below are from the last successful run, not from today.') +
    '</p></div>';
  return '<p class="sub" style="margin:0 0 14px">' +
    T('Ultimo controllo ' + n + ' ore fa.', 'Last checked ' + n + ' hours ago.') + '</p>';
}

function spark(series){
  if (!series || series.length < 2) return '';
  var w = 600, h = 56, cs = series.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, cs), hi = Math.max.apply(null, cs), rg = (hi - lo) || 1;
  var d = series.map(function(p, i){
    return (i ? 'L' : 'M') + (i / (series.length - 1) * w).toFixed(1) + ',' +
           (h - 4 - (p[1] - lo) / rg * (h - 8)).toFixed(1); }).join('');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
    'role="img" aria-label="' + T('Andamento del prezzo', 'Price trend') + '"><path d="' + d +
    '" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

/* Un numero piccolo dentro una frase si scrive a parole, non in cifre. */
function num2it(n){
  return ['zero','una','due','tre','quattro','cinque','sei'][n] || String(n);
}
function num2en(n){
  return ['zero','one','two','three','four','five','six'][n] || String(n);
}

/* Qui non c'è una barra di proposito. Le correlazioni stanno tutte fra 0,75 e
   0,99: una barra da zero le farebbe sembrare tutte piene, e una barra che
   parte da 0,7 per farle sembrare diverse sarebbe un trucco. Sei numeri in
   colonna, ordinati, si confrontano benissimo da soli. */

/* I pesi della formula sono scritti a mano. Questa scheda dice quanto la
   classifica dipende da quella scelta, compresa la parte che fa fare brutta
   figura alla formula. */
function stressCard(){
  var s = IDX.stress;
  if (!s || !s.equal) return '';
  var names = { insider: T('Insider', 'Insiders'), guid: T('Guidance e tono', 'Guidance and tone'),
                market: T('Mercato', 'Market'), sector: T('Settore', 'Sector'),
                events: T('Fatti rilevanti', 'Material events'),
                price: T('Contesto di prezzo', 'Price context') };
  var worst = (s.drop || []).filter(function(d){ return d.rho != null; });
  // Per dire quali voci reggono l'ordine contano solo quelle alimentate su
  // almeno dieci aziende: una correlazione su cinque elementi cambia molto se
  // una sola cambia posto, e non si confronta con una misurata su quaranta.
  var broad = worst.filter(function(d){ return d.n >= 10; });
  var carry = broad.slice(0, 2).map(function(d){ return names[d.id] || d.id; }).join(T(' e ', ' and '));
  var idle = broad.filter(function(d){ return d.rho >= 0.98; });
  // e che cosa dice la prova all'indietro (pagina Backtest) sulle stesse voci
  var icRows = (IDX.ic && IDX.ic.rows) || [];
  var icIdle = idle.filter(function(d){
    var r = icRows.filter(function(x){ return x.id === d.id; })[0];
    return r && r.ic != null && r.t != null && Math.abs(r.t) < 2; });
  var icNote = idle.length && icIdle.length === idle.length ? {
    it: 'E la prova all’indietro sulla pagina Backtest non trova in nessuna di loro una capacità di ' +
        'previsione distinguibile dal caso: per questo i loro pesi non vengono alzati. ',
    en: 'And the backward test on the Backtest page finds in none of them a predictive power ' +
        'distinguishable from chance: that is why their weights are not raised. '} : {it: '', en: ''};

  return '<div class="card"><h2>' + T('E se i pesi fossero altri?',
                                      'What if the weights were different?') + '</h2>' +
    '<p class="sub">' + T(
      'I sei numeri qui sopra li ho scelti io, a mano: nessuno li ha stimati. Finché resta così, ' +
      'la classifica potrebbe essere solo il riflesso di quella scelta. Allora il punteggio viene ' +
      'ricalcolato con pesi diversi — uguali fra loro, con una voce tolta alla volta, e ' +
      s.draws + ' volte con pesi tirati a caso, ognuno libero di valere da metà al doppio di ' +
      'quello scritto — e si guarda che cosa resta in piedi.',
      'I picked those six numbers by hand: nobody estimated them. While that stands, the ranking ' +
      'could be nothing but a reflection of that choice. So the score is recomputed under other ' +
      'weights — all equal, one input removed at a time, and ' + s.draws + ' times with weights ' +
      'drawn at random, each free to be anything from half to double the written one — and we ' +
      'look at what survives.') + '</p>' +
    '<div class="tiles">' +
      statTile(s.equal.rho, T('con pesi tutti uguali', 'with all weights equal'),
               T('correlazione di rango con la classifica pubblicata',
                 'rank correlation with the published ranking')) +
      statTile(s.rho.min, T('nel caso peggiore', 'in the worst case'),
               T('su ' + s.draws + ' sorteggi dei pesi', 'across ' + s.draws + ' weight draws')) +
      statTile(s.top_overlap.min + '/' + s.top, T('prime dieci che restano', 'of the top ten stay'),
               T('anche nel sorteggio più sfavorevole', 'even in the least favourable draw')) +
    '</div>' +
    '<div class="scroll"><table class="t-narrow"><thead><tr><th>' +
      T('Togliendo questa voce…', 'Removing this input…') + '</th><th class="num">' +
      T('…la classifica resta', '…the ranking stays') + '</th></tr></thead><tbody>' +
    worst.map(function(d){
      return '<tr style="cursor:default"><td><b>' + esc(names[d.id] || d.id) + '</b>' +
        '<div class="nm">' + T('alimentata su ' + d.n + ' aziende su ' +
          ((IDX.companies || []).length) + ' · punteggio spostato di ' + d.shift + ' punti',
          'fed on ' + d.n + ' of ' + ((IDX.companies || []).length) + ' companies · score moved by ' +
          d.shift + ' points') + '</div></td>' +
        '<td class="num"><b style="font-size:15px">' + d.rho.toFixed(3) + '</b></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="sub" style="margin-top:12px"><b>' + T('Quello che se ne ricava, per intero.',
                                                     'What this says, in full.') + '</b> ' + T(
      'La classifica non è un artefatto dei miei numeri: anche senza nessuna opinione, con i pesi ' +
      'tutti uguali, ' + (s.equal.top === s.top ? 'tutte le prime dieci restano' : s.equal.top + ' delle prime dieci restano') + ' al loro posto, e in ' + s.draws +
      ' sorteggi la correlazione di rango non è mai scesa sotto ' + s.rho.min + '. Ma il motivo è ' +
      'meno lusinghiero di quanto sembri: a reggere l’ordine sono soltanto ' + carry + '. ' +
      (idle.length ? 'Le altre' + (idle.length === 1 ? '' : ' ' + num2it(idle.length)) + ' — ' +
        idle.map(function(d){ return names[d.id] || d.id; }).join(', ') +
        ' — se tolte non cambiano quasi niente: nella forma attuale sono quasi decorative. ' : '') +
      icNote.it + 'E la guidance, che è il punto in cui l’estrazione dalle call fa il lavoro vero, è ' +
      'alimentata su poche aziende: dove c’è sposta parecchio, ma sulle altre il suo peso ' +
      'viene semplicemente ridistribuito.',
      'The ranking is not an artifact of my numbers: even with no opinion at all, with all weights ' +
      'equal, ' + (s.equal.top === s.top ? 'all of the top ten keep' : s.equal.top + ' of the top ten keep') + ' their place, and across ' + s.draws +
      ' draws the rank correlation never fell below ' + s.rho.min + '. But the reason is less ' +
      'flattering than it looks: the order is carried by ' + carry + ' alone. ' +
      (idle.length ? 'The other' + (idle.length === 1 ? ' one' : ' ' + num2en(idle.length)) + ' — ' +
        idle.map(function(d){ return names[d.id] || d.id; }).join(', ') +
        ' — change almost nothing when removed: in their current form they are close to ' +
        'decorative. ' : '') +
      icNote.en + 'And guidance, the one place where the extraction from the calls does the real work, is fed ' +
      'on few companies: where it exists it moves a lot, but elsewhere its weight is simply ' +
      'redistributed.') + '</p>' +
    '<p class="sub">' + T(
      'Sulla scheda di ogni azienda la stessa prova lascia una riga grigia sotto la barra del ' +
      'punteggio: è l’intervallo in cui il punteggio finisce in nove sorteggi su dieci. In ' +
      'media il verdetto scritto resta lo stesso nel ' + s.kept_avg + '% dei casi, e la fascia è ' +
      'larga ' + s.width_med + ' punti.',
      'On each company page the same test leaves a grey line under the score bar: it is where the ' +
      'score lands in nine draws out of ten. On average the written verdict stays the same in ' +
      s.kept_avg + '% of draws, and the band is ' + s.width_med + ' points wide.') +
    '</p></div>';
}

/* La distribuzione dei singoli acquisti: la tabella dà le mediane, questo da'
   la dispersione, che è l'informazione che una mediana nasconde. */
function distChart(bt){
  var d = bt.dist || [];
  if (!d.length) return '';
  var max = Math.max.apply(null, d.map(function(b){ return b.n; }));
  if (!max) return '';
  var bars = d.map(function(b){
    var up = (b.lo === null) ? false : b.lo >= 0;
    var lab = b.lo === null ? T('sotto il −' + Math.abs(b.hi) + '%', 'below −' + Math.abs(b.hi) + '%')
            : b.hi === null ? T('sopra il +' + b.lo + '%', 'above +' + b.lo + '%')
            : T('fra ' + sg(b.lo, 0) + '% e ' + sg(b.hi, 0) + '%',
                'between ' + sg(b.lo, 0) + '% and ' + sg(b.hi, 0) + '%');
    var title = b.n + ' ' + T(b.n === 1 ? 'acquisto' : 'acquisti', b.n === 1 ? 'purchase' : 'purchases') +
                ' ' + lab;
    return '<div class="hb' + (b.lo === 0 ? ' zero' : '') + '" style="--h:' +
           (b.n / max * 100).toFixed(1) + '%" title="' + esc(title) + '">' +
           (b.n === max ? '<b>' + b.n + '</b>' : '') +
           '<i style="background:' + (up ? 'var(--bull2)' : 'var(--bear2)') + '"></i></div>';
  }).join('');
  var neg = d.reduce(function(a, b){ return a + (b.lo !== null && b.lo >= 0 ? 0 : b.n); }, 0);
  var tot = d.reduce(function(a, b){ return a + b.n; }, 0);
  var isC = bt.unit === 'campaign';
  var unitIt = isC ? 'campagne' : 'acquisti', unitEn = isC ? 'campaigns' : 'purchases';
  return '<div class="hist"><div class="hist-plot" role="img" aria-label="' +
    esc(T('Distribuzione delle ' + tot + ' ' + unitIt + ' per rendimento a ' + bt.horizon + ' giorni',
          'Distribution of the ' + tot + ' ' + unitEn + ' by return at ' + bt.horizon + ' days')) +
    '">' + bars + '</div><div class="hist-axis"><span>−30%</span><span>0</span><span>+30%</span></div>' +
    '<p class="sub" style="margin-top:10px">' + esc(T(
      'Ogni barra conta le ' + unitIt + ' finite in quella fascia di rendimento. In blu le ' +
      (tot - neg) + ' finite in guadagno, in rosso le ' + neg + ' in perdita. La linea ' +
      'verticale è lo zero. Le due barre agli estremi raccolgono le code, altrimenti un ' +
      'singolo caso le allargherebbe tutte.',
      'Each bar counts the ' + unitEn + ' that ended in that return band. In blue the ' +
      (tot - neg) + ' that ended up, in red the ' + neg + ' that ended down. The vertical ' +
      'line is zero. The two end bars collect the tails, otherwise a single case would ' +
      'stretch the whole axis.')) + '</p></div>';
}

/* Il registro delle previsioni: il punteggio messo alla prova in avanti.
   All'inizio e' vuoto di proposito, e dirlo e' meta' del punto. */
function fwdCard(){
  var f = IDX.forward;
  if (!f) return '';
  var due = f.started ? new Date(new Date(f.started).getTime() + f.horizon * 864e5) : null;
  var head = '<div class="card"><h2>' + T('Il punteggio alla prova', 'The score put to the test') +
    '</h2><p class="sub">' + T(
      'Il backtest qui sotto prova due regole dentro la voce insider, non il punteggio. Il ' +
      'punteggio all\u2019indietro non si può provare: la guidance nel passato manca per quasi ' +
      'tutte le aziende, e ricostruirla vorrebbe dire inventarla. Quello che si può ' +
      'fare è segnarlo oggi e misurarlo dopo ' + f.horizon + ' giorni. Da qui in avanti ogni ' +
      'seduta lascia una riga per azienda in un file pubblico, e quando il tempo è passato quella ' +
      'riga diventa un risultato, giusto o sbagliato che sia.',
      'The backtest below tests two rules inside the insider input, not the score. The score ' +
      'cannot be tested backwards: past guidance is missing for almost every company, and ' +
      'rebuilding it would mean inventing it. What can be done is to record it ' +
      'today and measure it after ' + f.horizon + ' days. From now on every session leaves one ' +
      'row per company in a public file, and once the time has passed that row becomes a result, ' +
      'right or wrong.') + '</p>' +
    '<div class="tiles">' +
      statTile(f.observations, T('previsioni registrate', 'predictions recorded'),
               T('su ' + f.days + (f.days === 1 ? ' seduta' : ' sedute'),
                 'over ' + f.days + (f.days === 1 ? ' session' : ' sessions'))) +
      statTile(f.done, T('già misurate', 'already measured'),
               T('dopo ' + f.horizon + ' giorni', 'after ' + f.horizon + ' days')) +
      statTile(f.pending, T('in attesa', 'still open'),
               T('il tempo non è ancora passato', 'the time has not passed yet')) +
    '</div>';

  if (!f.done || !f.all) {
    return head + '<p class="sub">' + T(
      'Nessun risultato ancora, ed è giusto così: il registro è partito il ' +
        esc(day(f.started)) + ' e il primo esito arriva ' +
        (due ? 'intorno al ' + esc(day(due.toISOString().slice(0, 10))) : 'fra tre mesi') +
        '. Fino ad allora qui non c\u2019è niente da mostrare, e qualunque numero ci mettessimo ' +
        'sarebbe inventato.',
      'No results yet, and that is as it should be: the register started on ' +
        esc(day(f.started)) + ' and the first outcome is due ' +
        (due ? 'around ' + esc(day(due.toISOString().slice(0, 10))) : 'in three months') +
        '. Until then there is nothing to show here, and any number we put in would be made up.') +
      '</p><p class="sub"><a href="history.csv">' +
      T('Scarica il registro (CSV)', 'Download the register (CSV)') + '</a> — ' +
      T('in sola aggiunta: una previsione registrata non si corregge dopo.',
        'append-only: a recorded prediction is never edited afterwards.') + '</p></div>';
  }

  /* Le barre hanno tutte la stessa scala, altrimenti confrontarle non vorrebbe
     dire niente. La scala segue il dato e viene dichiarata sotto la tabella. */
  var shown = (f.bands || []).filter(function(b){ return b.n; });
  var scale = Math.ceil(Math.max.apply(null, shown.map(function(b){ return Math.abs(b.med); })
                .concat([Math.abs(f.all.med), 5])) / 2.5) * 2.5;
  var rows = shown.map(function(b){
    return fwdRow(T(b.it, b.en), b.lo + (b.hi > 100 ? '+' : '–' + (b.hi - 1)),
                  b.n, b.pos, b.med, scale);
  }).join('');
  return head + '<div class="scroll"><table class="t-narrow"><thead><tr><th>' +
    T('Fascia', 'Band') + '</th><th class="num">' +
    T('Mediana a ' + f.horizon + ' giorni', 'Median at ' + f.horizon + ' days') +
    '</th></tr></thead><tbody>' + rows +
    fwdRow(T('Tutte', 'All'), '', f.all.n, f.all.pos, f.all.med, scale, true) +
    '</tbody></table></div>' +
    '<p class="sub" style="margin-top:12px">' + T(
      'Se la formula vale qualcosa, le fasce alte devono rendere più di quelle basse: è ' +
      'questo che le barre lasciano vedere in un colpo d’occhio. Sono tutte sulla stessa ' +
      'scala, da −' + scale + '% a +' + scale + '%, e la linea verticale è lo zero. ' +
      'Con meno di dieci previsioni la fascia resta grigia: non è ancora un risultato.',
      'If the formula is worth anything, the higher bands should return more than the lower ones: ' +
      'that is what the bars make visible at a glance. They all share one scale, from −' +
      scale + '% to +' + scale + '%, and the vertical line is zero. Below ten predictions a band ' +
      'stays grey: it is not a result yet.') +
    ' <a href="history.csv">' + T('Scarica il registro (CSV)', 'Download the register (CSV)') +
    '</a></p></div>';
}
/* Una riga del registro: il nome della fascia con sotto da quante previsioni
   viene, e a destra la mediana con la sua barra. Il conteggio e la percentuale
   in guadagno stanno nella riga piccola invece che in due colonne: così la
   mediana resta visibile anche su un telefono, senza scorrimento laterale. */
function fwdRow(name, range, n, pos, med, scale, isAll){
  var thin = n < 10;
  var det = (range ? esc(range) + ' · ' : '') +
    T(n + (n === 1 ? ' previsione' : ' previsioni'), n + (n === 1 ? ' prediction' : ' predictions')) +
    ' · ' + Math.round(pos / n * 100) + '% ' + T('in guadagno', 'in the money');
  return '<tr style="cursor:default"><td><b' + (isAll ? '' : ' class="capf"') + '>' + esc(name) +
    '</b><div class="nm">' + det + '</div></td><td class="num"><span class="sc ret">' +
    retBar(med, scale, thin) + '<b style="color:' + (thin ? 'var(--ink3)' :
      med > 0 ? 'var(--bull2)' : med < 0 ? 'var(--bear2)' : 'inherit') + '">' +
    sg(med, 1) + '%</b></span></td></tr>';
}

/* Le prove indipendenti di un gruppo. Dal 22 novembre 2026 sono le campagne;
   un indice scritto dalla pipeline di prima ha solo gli episodi. */
function btCount(s){ return s ? (s.camp != null ? s.camp : s.ep) : 0; }

function btRow(label, s, note){
  var dash = '<td class="num">—</td>';
  if (!s) return '<tr style="cursor:default"><td>' + esc(label) + '</td>' + dash + dash + dash + dash + dash + '</tr>';
  var k = btCount(s);
  return '<tr style="cursor:default"><td><b>' + esc(label) + '</b>' +
    (note ? '<div class="nm">' + esc(note) + '</div>' : '') + '</td>' +
    '<td class="num"><b>' + k + '</b></td><td class="num">' + s.ep + '</td><td class="num">' + s.n + '</td>' +
    '<td class="num">' + Math.round(s.pos / k * 100) + '%</td>' +
    '<td class="num" style="color:' + (k < 5 ? 'var(--muted)' :
      s.med > 0 ? 'var(--bull)' : s.med < 0 ? 'var(--bear)' : 'inherit') +
    '">' + sg(s.med, 1) + '%</td></tr>';
}

/* La lettura nasce dai numeri: se le prove sono poche, lo dice e si ferma. */
function btVerdict(rule, a, b, yes, no, thin){
  if (!a || !b) return '';
  var k = btCount(a);
  if (k < 5) return '<p class="sub">' + esc(typeof thin === 'function' ? thin(k) : thin.replace('{n}', k)) + '</p>';
  return '<p class="sub">' + esc(a.med > b.med ? yes : no) + '</p>';
}

/* I bonus della voce insider: com'erano scritti a mano e quanto valgono
   stimati dai dati. Un bonus stimato vicino a zero non dice che la regola è
   sbagliata: dice che le prove non bastano per saperlo. La scheda lo scrive. */
function bonusCard(bt){
  var e = bt.bonus;
  if (!e || !e.features) return '';
  var names = { cluster: T('Cluster di compratori', 'Cluster of buyers'),
                two: T('Due compratori distinti', 'Two separate buyers'),
                senior: T('Dirigente apicale fra chi compra', 'Top executive among the buyers'),
                beat: T('Dopo una trimestrale sopra le attese', 'After results above expectations') };
  var notes = { cluster: T('3 o più persone entro 30 giorni', '3 or more people within 30 days'),
                two: T('sotto la soglia del cluster', 'below the cluster threshold'),
                senior: T('CEO, CFO o presidente', 'CEO, CFO or president'),
                beat: T('l’ultima prima del primo acquisto', 'the latest one before the first purchase') };
  var rows = e.features.map(function(f){
    var meas = f.raw == null ? T('non stimabile', 'cannot be estimated')
             : sg(f.raw, 1) + ' ± ' + f.se.toFixed(1);
    return '<tr style="cursor:default"><td><b>' + esc(names[f.id] || f.id) + '</b>' +
      '<div class="nm">' + esc(notes[f.id] || '') + ' · ' +
      T(f.n + (f.n === 1 ? ' campagna' : ' campagne'), f.n + (f.n === 1 ? ' campaign' : ' campaigns')) +
      (f.known != null ? T(' su ' + f.known + ' con il dato', ' of ' + f.known + ' with the data') : '') +
      '</div></td><td class="num">' + esc(meas) + '</td>' +
      '<td class="num" style="color:var(--ink3)">' + sg(f.hand, 0) + '</td>' +
      '<td class="num"><b>' + (f.points ? sg(f.points, 0) : '0') + '</b>' +
        (f.frozen ? '<div class="nm">' + T('fermo: dato in ' + Math.round(f.known / e.camp * 100) + '% delle campagne',
                                            'on hold: data in ' + Math.round(f.known / e.camp * 100) + '% of campaigns') + '</div>' : '') +
      '</td>' +
      '<td class="num" style="color:var(--ink3)">' + ['3', '5', '10'].map(function(t){
        var p = f.by_tau[t]; return p ? sg(p, 0) : '0'; }).join(' / ') + '</td></tr>';
  }).join('');
  return '<div class="card"><h2>' + T('I bonus, stimati dai dati', 'The bonuses, estimated from the data') +
    '</h2><p class="sub">' + T(
      'Fino al 22 novembre 2026 la voce insider dava +18 a un cluster, +10 a un dirigente apicale e +8 ' +
      'a due compratori: numeri scelti a mano. Ora li stimano le campagne qui sopra. L’effetto ' +
      'misurato è il rendimento in più a ' + bt.horizon + ' giorni, in punti percentuali, con la sua ' +
      'incertezza; il bonus usato è quell’effetto ristretto verso zero quanto più è incerto, a un ' +
      'punto di punteggio per punto percentuale. L’ultima riga è nuova, dal 23 novembre 2026: a mano ' +
      'non valeva niente, e si stima solo sulle campagne per cui si sa com’era andata l’ultima ' +
      'trimestrale (dati Alpha Vantage). Finché quelle campagne non sono almeno la metà, la stima si ' +
      'mostra ma non dà punti: con pochi casi dipenderebbe da quali aziende hanno il dato.',
      'Until 22 November 2026 the insider input gave +18 to a cluster, +10 to a top executive and +8 to ' +
      'two buyers: numbers picked by hand. Now the campaigns above estimate them. The measured effect is ' +
      'the extra return at ' + bt.horizon + ' days, in percentage points, with its uncertainty; the bonus ' +
      'used is that effect shrunk towards zero the more uncertain it is, at one score point per ' +
      'percentage point. The last row is new, since 23 November 2026: by hand it was worth nothing, and ' +
      'it is estimated only on the campaigns for which the latest results are known (Alpha Vantage ' +
      'data). Until those campaigns are at least half, the estimate is shown but gives no points: with few ' +
      'cases it would depend on which companies have the data.') + '</p>' +
    '<div class="scroll"><table><thead><tr><th>' + T('Regola', 'Rule') + '</th>' +
    '<th class="num">' + T('Effetto misurato', 'Measured effect') + '</th>' +
    '<th class="num">' + T('A mano', 'By hand') + '</th>' +
    '<th class="num">' + T('Stimato', 'Estimated') + '</th>' +
    '<th class="num">' + T('Con prudenza 3 / 5 / 10', 'With prudence 3 / 5 / 10') + '</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>' +
    '<p class="sub" style="margin-top:12px"><b>' + T('Come leggerlo.', 'How to read it.') + '</b> ' + T(
      'Un bonus stimato vicino a zero non dice che la regola è sbagliata: dice che ' + e.camp +
      ' campagne non bastano per saperlo. La prova l’ho fatta su dati inventati in cui gli effetti ' +
      'veri valgono 10, 4 e 6 punti: con 5.000 campagne lo stimatore li ritrova, con 26 li riduce a ' +
      '+2, −1 e +1. Man mano che il registro accumula campagne, i bonus potranno crescere da soli, ' +
      'se i dati li giustificano. L’unica scelta fatta a mano è la prudenza: quanto ci si aspetta ' +
      'che valga, al massimo plausibile, un effetto vero (' + e.tau + ' punti). L’ultima colonna ' +
      'mostra che cosa darebbero 3 e 10. La penalità per la vendita di un dirigente apicale (−10) ' +
      'resta scritta a mano, perché il backtest guarda solo gli acquisti.',
      'An estimated bonus close to zero does not say the rule is wrong: it says that ' + e.camp +
      ' campaigns are not enough to know. I tested it on made-up data where the true effects are 10, 4 ' +
      'and 6 points: with 5,000 campaigns the estimator recovers them, with 26 it shrinks them to +2, ' +
      '−1 and +1. As the register accumulates campaigns, the bonuses can grow on their own if the ' +
      'data justifies it. The only hand-made choice is the prudence: how large a true effect can ' +
      'plausibly be at most (' + e.tau + ' points). The last column shows what 3 and 10 would give. The ' +
      'penalty for a top executive selling (−10) stays hand-written, because the backtest only ' +
      'looks at purchases.') + '</p></div>';
}

/* Gli utili contro le attese arrivano a rate, dodici aziende al giorno: finché
