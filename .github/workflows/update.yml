name: Aggiorna i dati

on:
  # Per ora l'aggiornamento parte solo quando lo chiedi tu, dal pulsante
  # "Run workflow" nella scheda Actions.
  workflow_dispatch:
  # Tre giri al giorno nei feriali. I minuti non sono tondi di proposito:
  # alle :00 le code di GitHub sono lunghe e la partenza slitta.
  #   06:17 UTC  mattina europea, prima che tu apra il sito
  #   12:47 UTC  prima dell'apertura di New York
  #   22:35 UTC  dopo la chiusura, quando il prezzo del giorno e' definitivo
  schedule:
    - cron: "17 6 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "35 22 * * 1-5"
  push:
    branches: [main]
    paths: ["pipeline/**", "input/**", "config.json", "site/**",
            ".github/workflows/update.yml"]

# contents: per salvare data.json | pages e id-token: per pubblicare il sito
permissions:
  contents: write
  pages: write
  id-token: write

# Due giri ravvicinati non servono a niente: il piu' recente rigenera tutto
# comunque. Se ne parte uno mentre un altro e' in corso, il vecchio si ferma.
concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # I Form 4 gia' letti non si riscaricano: dal secondo giro in poi
      # l'aggiornamento dura un minuto invece di dieci.
      - name: Cache dei documenti SEC
        uses: actions/cache@v4
        with:
          path: cache
          key: sec-${{ hashFiles('config.json') }}-${{ github.run_id }}
          restore-keys: |
            sec-${{ hashFiles('config.json') }}-
            sec-

      - name: Test delle regole (senza rete)
        run: python -m tests.test_offline

      - name: Raccolta dati e calcolo
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.build

      # I file di site/ li rigenera per intero questo giro, quindi non vanno MAI
      # fusi con quelli di un altro giro: ogni riga differisce per l'orario e il
      # rebase finirebbe in conflitto su tutti e 41. Qui si riparte da origin e
      # si riscrive sopra: l'ultimo calcolo vince, che e' quello che vogliamo.
      - name: Salva il risultato
        run: |
          git config user.name  "conviction-engine-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --soft origin/main   # i file restano, cambia solo il punto di partenza
            git add -A site
            if git diff --staged --quiet; then
              echo "nessuna variazione da salvare"
              exit 0
            fi
            git commit --quiet -m "dati aggiornati al $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet origin HEAD:main; then
              echo "salvato al tentativo $i"
              exit 0
            fi
            echo "qualcuno ha scritto nel frattempo: riprovo ($i di 3)"
            sleep 5
          done
          echo "::warning::dati non salvati dopo tre tentativi; il prossimo giro riprova"

      # Il sito va pubblicato qui dentro: un commit fatto dal workflow non
      # fa partire altri workflow, quindi pages.yml da solo non basterebbe.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pubblica:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
