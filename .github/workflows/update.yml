name: Aggiorna i dati

on:
  # Parte anche quando lo chiedi tu, dal pulsante "Run workflow" nella scheda Actions.
  workflow_dispatch:
  # Un giro all'ora nei feriali, dalle 06:17 alle 23:17 UTC: copre la mattina
  # europea e tutta la giornata di deposito americana (EDGAR accetta i moduli
  # dalle 6 alle 22 di New York). Le ore 00-05 UTC restano fuori perché in
  # piena notte americana non si deposita niente e i prezzi non si muovono:
  # sarebbero richieste alla SEC senza una ragione.
  #
  # Un giro all'ora regge perché la pipeline riscrive una scheda solo se è
  # cambiata davvero: un giro a vuoto tocca il solo index.json, non tutte le
  # schede. Senza quello il repository crescerebbe di 4,6 MB ogni ora.
  #
  # Il minuto non è tondo di proposito: alle :00 le code di GitHub sono lunghe.
  schedule:
    - cron: "17 6-23 * * 1-5"
  push:
    branches: [main]
    paths: ["pipeline/**", "input/**", "config.json", "site/**",
            ".github/workflows/update.yml"]

# contents: per salvare data.json | pages e id-token: per pubblicare il sito
permissions:
  contents: write
  pages: write
  id-token: write

# Un giro alla volta. Se ne parte uno mentre un altro è in corso, aspetta che
# il primo finisca: non lo ferma. Fino al 23 novembre 2026 lo fermava, ma un
# giro fermato a metà perde tutto quello che ha scaricato (la cache si salva
# solo alla fine), e con i giri orari di GitHub che a volte partono con molto
# ritardo due giri si sovrapponevano: la mattina del 23 ne è arrivato uno solo
# su tre. In coda ne resta al massimo uno; se ne arriva un altro, prende il
# suo posto, e va bene così perché rigenera tutto comunque.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # I Form 4 già letti non si riscaricano: dal secondo giro in poi
      # l'aggiornamento dura un minuto invece di dieci.
      - name: Cache dei documenti SEC
        uses: actions/cache@v4
        with:
          path: cache
          key: sec-${{ hashFiles('config.json') }}-${{ github.run_id }}
          restore-keys: |
            sec-${{ hashFiles('config.json') }}-
            sec-

      # Utili contro le attese, calendario e elenco dei titoli: li scarica una
      # volta al giorno il workflow delle trascrizioni (trascrizioni.yml), che
      # possiede le 25 richieste di Alpha Vantage. Qui si leggono soltanto:
      # restore e non cache, così questo giro non salva mai una copia vecchia.
      # Se non c'è ancora niente il giro va avanti come prima.
      - name: Dati di Alpha Vantage
        uses: actions/cache/restore@v4
        with:
          path: cache-alphavantage
          key: alphavantage-${{ github.run_id }}
          restore-keys: |
            alphavantage-

      # Tutto il mercato e i grandi fondi: li scarica mercato.yml ogni tre ore.
      # Anche qui solo restore, come per Alpha Vantage.
      - name: Dati di tutto il mercato
        uses: actions/cache/restore@v4
        with:
          path: cache-mercato
          key: mercato-${{ github.run_id }}
          restore-keys: |
            mercato-

      - name: Test delle regole (senza rete)
        run: python -m tests.test_offline

      - name: Raccolta dati e calcolo
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.build

      # I file di site/ li rigenera per intero questo giro, quindi non vanno MAI
      # fusi con quelli di un altro giro: ogni riga differisce per l'orario e il
      # rebase finirebbe in conflitto su tutti e 41. Qui si riparte da origin e
      # si riscrive sopra: l'ultimo calcolo vince, che è quello che vogliamo.
      - name: Salva il risultato
        run: |
          git config user.name  "conviction-engine-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            git fetch --quiet origin main
            # NON usare --soft: lascerebbe nell'indice la versione dei file
            # che il runner aveva all'avvio, e il commit annullerebbe tutto
            # quello che hai caricato a mano nel frattempo (è successo al
            # README il 20/11). Il reset normale riallinea l'indice a
            # origin/main e lascia nel disco i file appena generati, così
            # il commit contiene solo site/.
            git reset --quiet origin/main
            # site/index.html non lo genera la pipeline: è la pagina, caricata a
            # mano. Quella nel disco è quella che il runner aveva all'avvio, e
            # con "git add -A site" il commit rimetteva la versione vecchia sopra
            # quella caricata durante il giro (è successo il 23/11, due volte).
            # Si salvano solo i file generati, e la pagina si riprende da origin
            # anche nel disco, perché la pubblicazione qui sotto usa quella.
            git add -A -- site ':(exclude)site/index.html'
            git checkout origin/main -- site/index.html
            if git diff --staged --quiet; then
              echo "nessuna variazione da salvare"
              exit 0
            fi
            git commit --quiet -m "dati aggiornati al $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet origin HEAD:main; then
              echo "salvato al tentativo $i"
              exit 0
            fi
            echo "qualcuno ha scritto nel frattempo: riprovo ($i di 3)"
            sleep 5
          done
          echo "::warning::dati non salvati dopo tre tentativi; il prossimo giro riprova"

      # Il sito va pubblicato qui dentro: un commit fatto dal workflow non
      # fa partire altri workflow, quindi pages.yml da solo non basterebbe.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pubblica:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
