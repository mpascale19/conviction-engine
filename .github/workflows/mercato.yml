name: Tutto il mercato

# Gli insider di tutte le società americane e i grandi fondi, dai file della SEC
# (vedi pipeline/mercato.py e pipeline/fondi.py). Finisce tutto nella cache
# "mercato-", da dove la legge il giro orario del sito (update.yml), che ne
# ricava il radar, il termometro di tutto il mercato e i 13F di ogni azienda.
#
# Il primo giro scarica i data set dei Form 4 dal 2006 (un'ottantina di file da
# circa 10 MB) e i primi file 13F (circa 90 MB l'uno, sei per giro); poi legge
# uno per uno i Form 4 dei giorni dopo l'ultimo data set, dal più recente. Ci
# vogliono alcuni giri per arrivare in pari; dopo, un giro dura pochi minuti:
# il giorno nuovo, e un data set nuovo quando la SEC lo pubblica.
#
# Ogni tre ore, anche nel fine settimana: l'indice giornaliero di EDGAR esce
# la sera, e il primo giro della mattina europea lo trova già.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Quanti minuti al massimo per questo giro"
        default: "50"
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: mercato
  cancel-in-progress: false

jobs:
  mercato:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dati dei giri precedenti
        uses: actions/cache@v4
        with:
          path: cache-mercato
          key: mercato-${{ github.run_id }}
          restore-keys: |
            mercato-

      - name: Scarica
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python -m pipeline.mercato --minutes "${{ github.event.inputs.minutes || '50' }}"
