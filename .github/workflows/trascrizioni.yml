name: Scarica trascrizioni

# Una volta al giorno (e quando lo premi a mano) usa le 25 richieste che la
# chiave gratuita di Alpha Vantage dà in un giorno. Prima il calendario delle
# trimestrali, l'elenco dei titoli quotati (una volta alla settimana) e gli utili
# contro le attese di al massimo 12 aziende: finiscono nella cache
# "alphavantage-", da dove li legge il giro orario del sito (update.yml). Poi,
# con le richieste che restano, le trascrizioni delle call che mancano: le salva
# in Word in un pacchetto che si scarica dalla pagina del giro, sotto
# "Artifacts", e che resta lì tre giorni.
#
# Le trascrizioni NON vengono salvate nel repository né pubblicate sul sito:
# sono testi protetti. Si danno a Claude in una conversazione, e nel repository
# entrano solo i fatti estratti (input/extracted/). Vedi pipeline/trascrizioni.py.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Quante richieste ad Alpha Vantage in tutto (al massimo 25 al giorno con la chiave gratuita)"
        default: "25"
      earnings:
        description: "Di quante aziende leggere gli utili contro le attese (il resto va alle trascrizioni)"
        default: "12"
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

concurrency:
  group: trascrizioni
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests python-docx

      # quali call sono già state scaricate, e il mese di chiusura dell'anno
      # fiscale di ogni azienda: così non si spreca la quota di Alpha Vantage
      - name: Stato dei giri precedenti
        uses: actions/cache@v4
        with:
          path: cache-trascrizioni
          key: trascrizioni-${{ github.run_id }}
          restore-keys: |
            trascrizioni-

      # calendario, elenco dei titoli e utili: li legge anche il giro orario del
      # sito, che ripristina la cache più recente con questo prefisso
      - name: Dati di Alpha Vantage dei giri precedenti
        uses: actions/cache@v4
        with:
          path: cache-alphavantage
          key: alphavantage-${{ github.run_id }}
          restore-keys: |
            alphavantage-

      - name: Scarica
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: >-
          python -m pipeline.trascrizioni
          --limit "${{ github.event.inputs.limit || '25' }}"
          --earnings "${{ github.event.inputs.earnings || '12' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: trascrizioni-${{ github.run_number }}
          path: trascrizioni/
          retention-days: 3
          if-no-files-found: warn
